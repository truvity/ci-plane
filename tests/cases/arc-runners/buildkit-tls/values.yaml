# the client certificate for the mutual-TLS BuildKit builders,
# mounted into every runner pod with CI_BUILDKIT_TLS_DIR pointing at it,
# the Certificate rendered by this release.
githubConfigUrl: https://github.com/example
controllerServiceAccount:
  namespace: arc-system
buildkitTLS:
  enabled: true
  serverName: buildkitd.example.private
  certificate:
    create: true
    issuerRef:
      name: ci-buildkit-client
  ca:
    configMapName: example-private-ca
