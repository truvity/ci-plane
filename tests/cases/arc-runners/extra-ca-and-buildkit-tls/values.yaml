# The two private-CA features together, as an estate sets them: a trust
# bundle from a ConfigMap with one named key (extraCACertificates), and the
# mutual-TLS client certificate with its trust bundle (buildkitTLS). The
# extra-ca volume's `items` must sit under its `configMap`; hack/golden.sh
# asserts that on this render.
githubConfigUrl: https://github.com/example
controllerServiceAccount:
  namespace: arc-system
buildkitTLS:
  enabled: true
  serverName: buildkitd.example.private
  certificate:
    create: true
    issuerRef:
      name: ci-buildkit-client
  ca:
    configMapName: example-private-ca
    key: ca-certificates.crt
extraCACertificates:
  configMapName: example-private-ca
  keys: [ca-certificates.crt]
