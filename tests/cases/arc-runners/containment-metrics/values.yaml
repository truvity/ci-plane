githubConfigUrl: https://github.com/example
controllerServiceAccount:
  namespace: arc-system
runner:
  watchdog:
    enabled: true
networkPolicy:
  containment:
    enabled: true
    name: release-runners
    serviceCidr: 172.20.0.0/16
    vpcCidr: 10.0.0.0/16
    cacheNamespace: ci-cache
    metricsFrom:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: vmagent
