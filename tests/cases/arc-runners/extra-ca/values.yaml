# extraCACertificates from a ConfigMap, with the default mountPath and every
# key: each runner pod mounts the ConfigMap read-only at /var/run/extra-ca,
# sets CI_EXTRA_CA_DIR to it, and starts run.sh behind
# /usr/local/bin/runner-extra-ca. Off (every other case), none of this
# renders and the command is run.sh alone.
githubConfigUrl: https://github.com/example
controllerServiceAccount:
  namespace: arc-system
extraCACertificates:
  configMapName: private-ca
