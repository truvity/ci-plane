# extraCACertificates from a Secret, one named key, a non-default mountPath,
# together with runner.watchdog: runner-extra-ca is the outer prefix and
# runner-watchdog still wraps run.sh behind it, so the watchdog stays PID 1.
githubConfigUrl: https://github.com/example
controllerServiceAccount:
  namespace: arc-system
runner:
  watchdog:
    enabled: true
extraCACertificates:
  secretName: private-ca
  keys: [roots.pem]
  mountPath: /etc/runner-ca
