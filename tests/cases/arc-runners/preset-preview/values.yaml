# The preview preset plus the estate facts it leaves to the caller; a
# release-wide `restricted` puts every set on the restricted profile.
githubConfigUrl: https://github.com/example
controllerServiceAccount:
  namespace: arc-system
runnerServiceAccountName: runner
restricted: true

# The estate facts the preview preset refers to by name: where the runners
# go (an AWS/Karpenter pool and its taints, listed with the karpenter
# preset) and how big each of its three sizes is.
nodeClasses:
  preview-runners:
    nodeSelector:
      karpenter.sh/nodepool: ci
    tolerations:
      - key: arch
        operator: Exists
      - key: ci
        value: "true"
        effect: NoSchedule
listenerTolerations:
  - key: arch
    operator: Exists
sizes:
  large:
    gomaxprocs: 4
    resources:
      requests: {cpu: "2", memory: 24Gi}
      limits: {cpu: "4", memory: 24Gi, ephemeral-storage: 40Gi}
  medium:
    gomaxprocs: 4
    resources:
      requests: {cpu: "2", memory: 14Gi}
      limits: {cpu: "4", memory: 14Gi, ephemeral-storage: 30Gi}
  small:
    gomaxprocs: 2
    resources:
      requests: {cpu: "1", memory: 6Gi}
      limits: {cpu: "2", memory: 6Gi, ephemeral-storage: 20Gi}
