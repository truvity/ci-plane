githubConfigUrl: https://github.com/example
controllerServiceAccount:
  namespace: arc-system
runnerServiceAccountName: runner
restricted: true

# The estate facts the stable preset refers to by name.
nodeClasses:
  stable-runners:
    nodeSelector:
      karpenter.sh/nodepool: ci-stable
    tolerations:
      - key: arch
        operator: Exists
      - key: ci-stable
        value: "true"
        effect: NoSchedule
listenerTolerations:
  - key: arch
    operator: Exists
sizes:
  large:
    gomaxprocs: 16
    resources:
      requests: {cpu: "8", memory: 32Gi}
      limits: {cpu: "16", memory: 32Gi, ephemeral-storage: 60Gi}
