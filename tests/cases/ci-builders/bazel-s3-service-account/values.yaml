# bazel-remote's S3 proxy backend with the chart owning the ServiceAccount
# the Pod Identity association is made against.
buildkitd:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
npmCache:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
bazelRemote:
  serviceAccountName: bazel-remote
  serviceAccount:
    create: true
  s3:
    enabled: true
    bucket: example-bucket
    region: eu-example-1
    prefix: bazel-remote/
