# The Go module proxy, which is off by default: an S3 prefix, the pod's
# own identity (a ServiceAccount the estate wires), and the runner
# namespaces allowed to reach it.
buildkitd:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
npmCache:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
goModproxy:
  enabled: true
  s3:
    bucket: example-bucket
    region: eu-example-1
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
