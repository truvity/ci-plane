# The stable preset turns the Gradle remote build cache of cache-redirect ON, as
# the preview preset does (G2): the stable tier is its own deployment with its
# own bucket, so only stable jobs write what stable jobs read. Maven is on by
# default.
buildkitd:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
npmCache:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
nodeClasses:
  cache-plane: {}
  builders-arm64: {}
  builders-amd64: {}
cacheRedirect:
  enabled: true
  s3:
    bucket: example-bucket
    region: eu-example-1
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
