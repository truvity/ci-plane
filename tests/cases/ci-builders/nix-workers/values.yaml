# Persistent Nix workers at the v5 defaults -- an ephemeral host key per
# pod signed as a host certificate, the `nix` ssh-ng login for ci-nix,
# trusted -- plus the opkssh pilot on one architecture. No
# nix-builder-server Secret is mounted anywhere in this render.
buildkitd:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
npmCache:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
nixWorkers:
  enabled: true
  ssh:
    trustedUserCAKeys:
      - ssh-ed25519 AAAATEST
  networkPolicy:
    consumerNamespaces: [arc-runners-example, arc-runners-other]
  openbao:
    address: https://openbao.example
    namespace: example
    caBundle: dGVzdA==
    authMount: jwt-example
    authRole: nix-worker
  opkssh:
    archs: [amd64]
    issuer: https://access.example
    clientId: opkssh
    nixGroup: example.nix-workers.user
    adminGroup: example.nix-workers.admin
