buildkitd:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
npmCache:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
nixWorkers:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
  ssh:
    trustedUserCAKeys:
      - ssh-ed25519 AAAATEST
  openbao:
    address: https://openbao.example
    namespace: example
    caBundle: dGVzdA==
    authMount: jwt-example

# The estate facts the preset refers to by name: three pools of an
# AWS/Karpenter fleet (listed with the karpenter preset).
nodeClasses:
  cache-plane:
    tolerations:
      - key: arch
        operator: Exists
  builders-arm64:
    nodeSelector:
      karpenter.sh/nodepool: build
      karpenter.sh/capacity-type: on-demand
    tolerations:
      - key: build
        value: "true"
        effect: NoSchedule
  builders-amd64:
    nodeSelector:
      karpenter.sh/nodepool: build
      karpenter.sh/capacity-type: on-demand
    tolerations:
      - key: build
        value: "true"
        effect: NoSchedule
  nix-workers-arm64:
    nodeSelector:
      karpenter.sh/nodepool: build
    tolerations:
      - key: build
        value: "true"
        effect: NoSchedule
  nix-workers-amd64:
    nodeSelector:
      karpenter.sh/nodepool: build
    tolerations:
      - key: build
        value: "true"
        effect: NoSchedule
