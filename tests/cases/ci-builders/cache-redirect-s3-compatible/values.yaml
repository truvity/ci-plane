# cache-redirect on an S3-compatible store with no pod identity: an
# endpoint, path-style addressing, static keys from an existing Secret,
# the Nix front-end alone, a longer redirect TTL and an extra flag.
buildkitd:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
npmCache:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
cacheRedirect:
  enabled: true
  replicas: 3
  s3:
    bucket: example-bucket
    region: auto
    endpoint: https://storage.example
    pathStyle: true
    existingSecret: cache-redirect-keys
  presignTTL: 15m
  goproxy:
    enabled: false
  extraArgs: ["-negative-ttl=5m"]
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
