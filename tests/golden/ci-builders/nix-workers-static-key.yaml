apiVersion: apps/v1
kind: Deployment
metadata:
  name: npm-cache
  labels:
    app.kubernetes.io/name: npm-cache
    app.kubernetes.io/part-of: ci-builders
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: npm-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: npm-cache
        app.kubernetes.io/part-of: ci-builders
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # verdaccio uid in the official image
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verdaccio
          image: docker.io/verdaccio/verdaccio:6.10.4
          # No args: the image's entrypoint is `dumb-init --` with
          # `verdaccio --config /verdaccio/conf/config.yaml` as CMD —
          # args REPLACE the CMD, so passing flags alone makes
          # dumb-init exec "--config" and crashloop. The mount below
          # lands on the image's default config path.
          ports:
            - name: http
              containerPort: 4873
          volumeMounts:
            - name: conf
              mountPath: /verdaccio/conf
              readOnly: true
            - name: data
              mountPath: /verdaccio/storage
          readinessProbe:
            httpGet:
              path: /-/ping
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: conf
          configMap:
            name: npm-cache-config-v1
        - name: data
          persistentVolumeClaim:
            claimName: npm-cache-data

