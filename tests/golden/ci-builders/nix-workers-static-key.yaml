        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Rootless buildkit needs user namespaces; the default sysctl
        # ceiling on minimal hosts is too low.
        - name: enable-userns
          image: docker.io/library/busybox:1.38
          command: ["sysctl", "-w", "user.max_user_namespaces=63359"]
          securityContext:
            privileged: true
      containers:
        - name: buildkitd
          image: docker.io/moby/buildkit:v0.33.0-rootless
          args:
            - --addr
            - tcp://0.0.0.0:1234
            - --oci-worker-no-process-sandbox
          ports:
            - name: grpc
              containerPort: 1234
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: Unconfined
          readinessProbe:
            exec:
              # --addr: buildctl defaults to the unix socket; the daemon
              # listens on TCP for the runners.
              command: ["buildctl", "--addr", "tcp://127.0.0.1:1234", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            limits:
              ephemeral-storage: 10Gi
              memory: 6Gi
            requests:
              cpu: 1000m
              ephemeral-storage: 2Gi
              memory: 4Gi
          volumeMounts:
            - name: cache
              mountPath: /home/user/.local/share/buildkit
  volumeClaimTemplates:
    - metadata:
        name: cache
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi

---
# Source: ci-builders/templates/nix-workers.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nix-worker-amd64
  labels:
    app.kubernetes.io/name: nix-worker
    app.kubernetes.io/part-of: ci-builders
    ci-plane.io/arch: amd64
spec:
  serviceName: nix-worker-amd64
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nix-worker
      ci-plane.io/arch: amd64
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nix-worker
        app.kubernetes.io/part-of: ci-builders
        ci-plane.io/arch: amd64
      annotations:
        # The principals ConfigMap is content-addressed ($principalsName
        # above), so its own name already changes the pod template on a
        # values change -- but the checksum is kept explicit anyway: it
        # is the thing that actually documents, and guards, the intent
        # that a nixWorkers.accounts.nix.principals edit must roll the
        # StatefulSet. AllowUsers and the copied principals file
        # (nix-worker-entrypoint.sh) are both decided once at container
        # startup, never re-read live, so a running pod's ability to
        # reach `nix` at all is fixed until it restarts.
        checksum/nix-worker-principals: a798b637df11906f2e69355c79da09987469590b11dd940719bb9d9a87a89205
        # Same reasoning, for opkssh's own two files: whether THIS arch
        # copies them in is fixed at container start
        # (NIX_WORKER_OPKSSH_ENABLED below), so a provider/group edit --
        # or flipping this arch in or out of opkssh.archs -- must roll
        # the StatefulSet too. Keyed on the arch's own opkssh state, not
        # just the shared ConfigMap's content: two identical ConfigMaps
        # can still mean different things to an on-list vs. an off-list
        # arch.
        checksum/nix-worker-opkssh: 0ed7f8692ac00abb5ddf552db47df57babe58473b17089521d899078c775643e
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64
      initContainers:
        - name: seed-store
          image: ghcr.io/truvity/ci-plane/nix-worker:latest
          command: ["/usr/local/bin/nix-worker-seed"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: store
              mountPath: /seed/nix
            - name: runtime
              mountPath: /runtime
      containers:
        - name: nix-worker
          image: ghcr.io/truvity/ci-plane/nix-worker:latest
          command: ["/usr/bin/tini", "--", "/usr/local/bin/nix-worker-entrypoint"]
          env:
            - name: NIX_WORKER_MAX_JOBS
              value: "2"
            - name: NIX_WORKER_CORES
              value: "4"
            - name: NIX_WORKER_MIN_FREE_BYTES
              value: "10737418240"
            - name: NIX_WORKER_MAX_FREE_BYTES
              value: "21474836480"
            - name: NIX_WORKER_ACCOUNTS_NIX_TRUSTED
              value: "true"
            # opkssh (the people pilot): true only for the
            # architecture(s) named in nixWorkers.opkssh.archs -- every
            # other arch's container gets "false" and renders exactly as
            # it did before this feature existed, even though it shares
            # the same image and the same opkssh-src ConfigMap.
            - name: NIX_WORKER_OPKSSH_ENABLED
              value: "false"
          ports:
            - name: ssh
              containerPort: 2222
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            privileged: true
            readOnlyRootFilesystem: true
          startupProbe:
            exec:
              command: ["/usr/local/bin/nix-worker-healthcheck"]
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            exec:
              # --readiness, on THIS probe alone: it is the only one of
              # the three that may watch the host certificate's
              # remaining life (image/nix-worker-healthcheck.sh) --
              # startupProbe/livenessProbe below stay identical to
              # before so a stalled renewal loop never kills a pod that
              # still serves under a still-valid certificate.
              command: ["/usr/local/bin/nix-worker-healthcheck", "--readiness"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/usr/local/bin/nix-worker-healthcheck"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            limits:
              cpu: "4"
              ephemeral-storage: 50Gi
              memory: 16Gi
            requests:
              cpu: "2"
              ephemeral-storage: 10Gi
              memory: 8Gi
          volumeMounts:
            - name: store
              mountPath: /nix
            - name: runtime
              mountPath: /run/nix-worker
            - name: build
              mountPath: /build
            - name: tmp
              mountPath: /tmp
            # The static host key (the explicit static-key path). With a
            # host certificate the entrypoint generates an ephemeral key
            # per pod in the runtime emptyDir instead, and nothing is
            # mounted here.
            - name: ssh
              mountPath: /etc/nix-worker/ssh
              readOnly: true
            - name: trusted-user-ca
              mountPath: /etc/nix-worker/ca
              readOnly: true
            - name: principals
              mountPath: /etc/nix-worker/principals-src
              readOnly: true
            - name: opkssh-src
              mountPath: /etc/nix-worker/opkssh-src
              readOnly: true
            # /etc/opk backed by a real (writable) emptyDir, shadowing
            # the image's own placeholder directory: readOnlyRootFilesystem
            # above means opkssh's hardcoded /etc/opk/{providers,auth_id}
            # paths could never be written at container start otherwise
            # (image/nix-worker-entrypoint.sh does that write, every
            # arch, regardless of NIX_WORKER_OPKSSH_ENABLED -- see that
            # script for why leaving it unmounted is not an option).
            - name: opk
              mountPath: /etc/opk
      volumes:
        # Memory-backed: with a host certificate the worker's ephemeral
        # host PRIVATE key lives here (nix-worker-entrypoint.sh), and a
        # key that exists only for the life of the pod has no business
        # on the node's disk. Everything else here is a few small files
        # (paths, pids, the principals copy, the runtime sshd_config).
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: build
          emptyDir:
            sizeLimit: 40Gi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: ssh
          secret:
            secretName: nix-builder-server
            defaultMode: 0400
            items:
              - key: ssh_host_ed25519_key
                path: ssh_host_ed25519_key
        - name: trusted-user-ca
          configMap:
            name: nix-worker-trusted-user-ca-505c1089d201
            defaultMode: 0444
        - name: principals
          configMap:
            name: nix-worker-principals-a798b637df11
            defaultMode: 0444
        - name: opkssh-src
          configMap:
            name: nix-worker-opkssh-cbe5cfdf7c21
            defaultMode: 0444
        - name: opk
          emptyDir:
            sizeLimit: 1Mi
  volumeClaimTemplates:
    - metadata:
        name: store
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
