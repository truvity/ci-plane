apiVersion: apps/v1
kind: Deployment
metadata:
  name: nix-cache
  labels:
    app.kubernetes.io/name: nix-cache
    app.kubernetes.io/part-of: ci-builders
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: nix-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nix-cache
        app.kubernetes.io/part-of: ci-builders
    spec:
      enableServiceLinks: false
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.31.6-alpine
          command: ["nginx", "-c", "/etc/nginx-cache/nginx.conf", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx-cache
              readOnly: true
            - name: data
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101 # nginx uid in the official alpine image
            capabilities:
              drop: ["ALL"]
      securityContext:
        fsGroup: 101
        # Pod Security `restricted` needs seccomp set; nginx needs nothing
        # beyond the runtime's default syscall filter.
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: conf
          configMap:
            name: nix-cache-nginx-v3
        - name: data
          persistentVolumeClaim:
            claimName: nix-cache-data
        - name: tmp
          emptyDir: {}

