# Source: ci-builders/templates/bazel-remote.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazel-remote
  labels:
    app.kubernetes.io/name: bazel-remote
    app.kubernetes.io/part-of: ci-builders
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: bazel-remote
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bazel-remote
        app.kubernetes.io/part-of: ci-builders
    spec:
      # The Service is named bazel-remote → k8s service links inject
      # BAZEL_REMOTE_PORT=tcp://ip:8080, which the binary parses as its
      # OWN --port env flag and crashes. Kill service-link envs.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bazel-remote
          image: docker.io/buchgr/bazel-remote-cache:v2.6.2
          imagePullPolicy: IfNotPresent
          args:
            - --dir=/data
            - --max_size=8
            - --port=8080
            - --grpc_port=9092
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9092
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bazel-remote-data

