---
# Source: ci-builders/templates/bazel-remote.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazel-remote
  labels:
    app.kubernetes.io/name: bazel-remote
    app.kubernetes.io/part-of: ci-builders
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: bazel-remote
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bazel-remote
        app.kubernetes.io/part-of: ci-builders
    spec:
      # The Service is named bazel-remote → k8s service links inject
      # BAZEL_REMOTE_PORT=tcp://ip:8080, which the binary parses as its
      # OWN --port env flag and crashes. Kill service-link envs.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bazel-remote
          image: docker.io/buchgr/bazel-remote-cache:v2.6.2
          imagePullPolicy: IfNotPresent
          args:
            - --dir=/data
            - --max_size=8
            - --port=8080
            - --grpc_port=9092
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9092
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bazel-remote-data

---
# Source: ci-builders/templates/npm-cache.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: npm-cache
  labels:
    app.kubernetes.io/name: npm-cache
    app.kubernetes.io/part-of: ci-builders
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: npm-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: npm-cache
        app.kubernetes.io/part-of: ci-builders
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # verdaccio uid in the official image
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verdaccio
          image: docker.io/verdaccio/verdaccio:6.10.4
          # No args: the image's entrypoint is `dumb-init --` with
          # `verdaccio --config /verdaccio/conf/config.yaml` as CMD —
          # args REPLACE the CMD, so passing flags alone makes
          # dumb-init exec "--config" and crashloop. The mount below
          # lands on the image's default config path.
          ports:
            - name: http
              containerPort: 4873
          volumeMounts:
            - name: conf
              mountPath: /verdaccio/conf
              readOnly: true
            - name: data
              mountPath: /verdaccio/storage
          readinessProbe:
            httpGet:
              path: /-/ping
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: conf
          configMap:
            name: npm-cache-config-v1
        - name: data
          persistentVolumeClaim:
            claimName: npm-cache-data

---
# Source: ci-builders/templates/buildkitd.yaml
# Rootless BuildKit: no privileged securityContext. The unconfined
# seccomp profile is the documented rootless-buildkit requirement —
# user-namespace isolation replaces the default profile, which blocks
# the unprivileged clone/mount syscalls rootless depends on.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: buildkitd-arm64
  labels:
    app.kubernetes.io/name: buildkitd
    app.kubernetes.io/part-of: ci-builders
  annotations:
    # stakater/Reloader: buildkitd reads its certificate once, at start, so
    # a renewed server certificate (or a replaced client CA) restarts the pod.
    secret.reloader.stakater.com/reload: buildkitd-mtls-arm64-tls
    configmap.reloader.stakater.com/reload: buildkitd-client-ca
spec:
  serviceName: buildkitd-arm64
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkitd
      ci-plane.io/arch: arm64
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkitd
        app.kubernetes.io/part-of: ci-builders
        ci-plane.io/arch: arm64
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Rootless buildkit needs user namespaces; the default sysctl
        # ceiling on minimal hosts is too low.
        - name: enable-userns
          image: docker.io/library/busybox:1.38
          command: ["sysctl", "-w", "user.max_user_namespaces=63359"]
          securityContext:
            privileged: true
      containers:
        - name: buildkitd
          image: docker.io/moby/buildkit:v0.33.0-rootless
          args:
            - --addr
            - tcp://0.0.0.0:1234
            - --addr
            - unix:///run/user/1000/buildkit/buildkitd.sock
            - --tlscert
            - /etc/buildkit/tls/tls.crt
            - --tlskey
            - /etc/buildkit/tls/tls.key
            - --tlscacert
            - /etc/buildkit/client-ca/ca.crt
            - --oci-worker-no-process-sandbox
          ports:
            - name: grpc
              containerPort: 1234
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: Unconfined
          readinessProbe:
            exec:
              # The unix socket, which buildkitd leaves plain: the tcp://
              # listener demands a client certificate.
              command: ["buildctl", "--addr", "unix:///run/user/1000/buildkit/buildkitd.sock", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            limits:
              ephemeral-storage: 10Gi
              memory: 6Gi
            requests:
              cpu: 1000m
              ephemeral-storage: 2Gi
              memory: 4Gi
          volumeMounts:
            - name: cache
              mountPath: /home/user/.local/share/buildkit
            - name: tls
              mountPath: /etc/buildkit/tls
              readOnly: true
            - name: client-ca
              mountPath: /etc/buildkit/client-ca
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: buildkitd-mtls-arm64-tls
            defaultMode: 0440
        - name: client-ca
          configMap:
            name: buildkitd-client-ca
            items:
              - key: ca.crt
                path: ca.crt
  volumeClaimTemplates:
    - metadata:
        name: cache
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi

