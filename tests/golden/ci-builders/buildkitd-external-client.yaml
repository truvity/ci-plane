---
# Source: ci-builders/templates/buildkitd-external-clients.yaml
# Admits exactly this identity: its common name, client auth, ECDSA, from the
# release namespace only. The in-cluster runners' policy (ci-buildkit-client) does
# not bind here, so it cannot admit this namespace's requests, and this one
# does not admit theirs.
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: ci-buildkit-client-outside
spec:
  allowed:
    commonName:
      required: true
      value: "ci-runner-outside"
    usages:
      - client auth
      - digital signature
      - key encipherment
    isCA: false
  constraints:
    privateKey:
      algorithm: ECDSA
      minSize: 256
      maxSize: 521
  selector:
    issuerRef:
      name: ci-buildkit-client
      kind: ClusterIssuer
      group: cert-manager.io
    namespace:
      matchNames:
        - "example"

---
# Source: ci-builders/templates/buildkitd-mtls.yaml
# approver-policy: only the listed namespaces may request from this issuer,
# and only client-auth certificates carrying the one common name, ECDSA.
# Anything else is denied, including every SAN.
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: ci-buildkit-client
spec:
  allowed:
    commonName:
      required: true
      value: "ci-runner"
    usages:
      - client auth
      - digital signature
      - key encipherment
    isCA: false
  constraints:
    privateKey:
      algorithm: ECDSA
      minSize: 256
      maxSize: 521
  selector:
    issuerRef:
      name: ci-buildkit-client
      kind: ClusterIssuer
      group: cert-manager.io
    namespace:
      matchNames:
        - arc-runners-example

---
# Source: ci-builders/templates/buildkitd-mtls.yaml
# Cluster-scoped, so a runner namespace can neither read the CA key (it is
# in cert-manager) nor sign with it: it can only ask, and the policy
# below decides.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ci-buildkit-client
spec:
  ca:
    secretName: ci-buildkit-client-ca

---
# Source: ci-builders/templates/buildkitd-mtls.yaml
# The root of the client trust: a self-signed issuer whose only job is to
# sign the CA below. Namespaced, so the allow-all policy for namespaced
# Issuers admits its requests.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: ci-buildkit-client-selfsigned
  namespace: cert-manager
spec:
  selfSigned: {}

---
# Source: ci-builders/templates/buildkitd-external-clients.yaml
# The pair cert-manager issued, and the CA bundle, pushed as three values:
# ca.pem, cert.pem and key.pem, each to its own remote name (relative to the
# store's prefix, if it has one). Nothing is deleted from the store if this
# object goes (deletionPolicy None).
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: buildkit-client-outside
  labels:
    app.kubernetes.io/name: buildkit-client-outside
    app.kubernetes.io/part-of: ci-builders
spec:
  refreshInterval: 30m
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - name: example-push
      kind: ClusterSecretStore
  selector:
    secret:
      name: buildkit-client-outside-tls
  template:
    engineVersion: v2
    mergePolicy: Replace
    data:
      ca.pem: |
        -----BEGIN CERTIFICATE-----
        MIIBexample
        -----END CERTIFICATE-----
      cert.pem: '{{ index . "tls.crt" }}'
      key.pem: '{{ index . "tls.key" }}'
  # conversionStrategy is the field the CRD defaults to None: written out, so
  # the object Argo CD applies is the object the cluster stores (left out, the
  # application is OutOfSync for good).
  data:
    - conversionStrategy: None
      match:
        secretKey: ca.pem
        remoteRef:
          remoteKey: "ca"
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          description: BuildKit client credential outside, pushed by External Secrets
          kmsKeyID: alias/example-client
          secretType: SecureString
          tags:
            component: ci
    - conversionStrategy: None
      match:
        secretKey: cert.pem
        remoteRef:
          remoteKey: "cert"
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          description: BuildKit client credential outside, pushed by External Secrets
          kmsKeyID: alias/example-client
          secretType: SecureString
          tags:
            component: ci
    - conversionStrategy: None
      match:
        secretKey: key.pem
        remoteRef:
          remoteKey: "key"
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          description: BuildKit client credential outside, pushed by External Secrets
          kmsKeyID: alias/example-client
          secretType: SecureString
          tags:
            component: ci
