# Source: ci-builders/templates/buildkitd-mtls.yaml
# trust-manager copies the CA CERTIFICATE (never its key) into this
# release's namespace as the ConfigMap the builders read.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: buildkitd-client-ca
spec:
  sources:
    - secret:
        name: ci-buildkit-client-ca
        key: ca.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: example

