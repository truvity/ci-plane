# Source: ci-builders/templates/bazel-remote.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazel-remote
  labels:
    app.kubernetes.io/name: bazel-remote
    app.kubernetes.io/part-of: ci-builders
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: bazel-remote
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bazel-remote
        app.kubernetes.io/part-of: ci-builders
    spec:
      # EKS Pod Identity binds an IAM role to a namespace + ServiceAccount
      # pair. This must be the exact ServiceAccount the estate's Pod
      # Identity association names, or the mismatch is SILENT: the pod
      # starts, answers every read/write request, and the S3 backend
      # simply has no credentials, so nothing lands in the bucket and
      # nothing looks broken until someone measures the hit rate.
      serviceAccountName: bazel-remote
      # The Service is named bazel-remote → k8s service links inject
      # BAZEL_REMOTE_PORT=tcp://ip:8080, which the binary parses as its
      # OWN --port env flag and crashes. Kill service-link envs.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bazel-remote
          image: docker.io/buchgr/bazel-remote-cache:v2.6.2
          imagePullPolicy: IfNotPresent
          args:
            - --dir=/data
            - --max_size=8
            - --port=8080
            - --grpc_port=9092
            # S3 is a PROXY backend in front of --dir above (upstream
            # bazel-remote docs): the PVC stays the working set and
            # every read/write still goes through it first. auth_method
            # iam_role with no --s3.iam_role_endpoint makes the minio
            # client look for credentials in "the standard locations for
            # the AWS platform" -- which is where EKS Pod Identity
            # injects them (AWS_CONTAINER_CREDENTIALS_*), so no key
            # material belongs in this chart.
            - --s3.bucket=example-bucket
            - --s3.region=eu-example-1
            - --s3.auth_method=iam_role
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9092
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bazel-remote-data

---
# Source: ci-builders/templates/nix-cache.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nix-cache
  labels:
    app.kubernetes.io/name: nix-cache
    app.kubernetes.io/part-of: ci-builders
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: nix-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nix-cache
        app.kubernetes.io/part-of: ci-builders
    spec:
      enableServiceLinks: false
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.31.6-alpine
          command: ["nginx", "-c", "/etc/nginx-cache/nginx.conf", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx-cache
              readOnly: true
            - name: data
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101 # nginx uid in the official alpine image
            capabilities:
              drop: ["ALL"]
      securityContext:
        fsGroup: 101
      volumes:
        - name: conf
          configMap:
            name: nix-cache-nginx-v3
        - name: data
          persistentVolumeClaim:
            claimName: nix-cache-data
        - name: tmp
          emptyDir: {}

---
# Source: ci-builders/templates/npm-cache.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: npm-cache
  labels:
    app.kubernetes.io/name: npm-cache
    app.kubernetes.io/part-of: ci-builders
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: npm-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: npm-cache
        app.kubernetes.io/part-of: ci-builders
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # verdaccio uid in the official image
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verdaccio
          image: docker.io/verdaccio/verdaccio:6.10.4
          # No args: the image's entrypoint is `dumb-init --` with
          # `verdaccio --config /verdaccio/conf/config.yaml` as CMD —
          # args REPLACE the CMD, so passing flags alone makes
          # dumb-init exec "--config" and crashloop. The mount below
          # lands on the image's default config path.
          ports:
            - name: http
              containerPort: 4873
          volumeMounts:
            - name: conf
              mountPath: /verdaccio/conf
              readOnly: true
            - name: data
              mountPath: /verdaccio/storage
          readinessProbe:
            httpGet:
              path: /-/ping
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: conf
          configMap:
            name: npm-cache-config-v1
        - name: data
          persistentVolumeClaim:
            claimName: npm-cache-data

---
# Source: ci-builders/templates/buildkitd.yaml
# Rootless BuildKit: no privileged securityContext. The unconfined
# seccomp profile is the documented rootless-buildkit requirement —
# user-namespace isolation replaces the default profile, which blocks
# the unprivileged clone/mount syscalls rootless depends on.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: buildkitd-arm64
  labels:
    app.kubernetes.io/name: buildkitd
    app.kubernetes.io/part-of: ci-builders
spec:
  serviceName: buildkitd-arm64
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkitd
      ci-plane.io/arch: arm64
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkitd
        app.kubernetes.io/part-of: ci-builders
        ci-plane.io/arch: arm64
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Rootless buildkit needs user namespaces; the default sysctl
        # ceiling on minimal hosts is too low.
        - name: enable-userns
          image: docker.io/library/busybox:1.38
          command: ["sysctl", "-w", "user.max_user_namespaces=63359"]
          securityContext:
            privileged: true
      containers:
        - name: buildkitd
          image: docker.io/moby/buildkit:v0.33.0-rootless
          args:
            - --addr
            - tcp://0.0.0.0:1234
            - --oci-worker-no-process-sandbox
          ports:
            - name: grpc
              containerPort: 1234
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: Unconfined
          readinessProbe:
            exec:
              # --addr: buildctl defaults to the unix socket; the daemon
              # listens on TCP for the runners.
              command: ["buildctl", "--addr", "tcp://127.0.0.1:1234", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            limits:
              ephemeral-storage: 10Gi
              memory: 6Gi
            requests:
              cpu: 1000m
              ephemeral-storage: 2Gi
              memory: 4Gi
          volumeMounts:
            - name: cache
              mountPath: /home/user/.local/share/buildkit
  volumeClaimTemplates:
    - metadata:
        name: cache
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi

