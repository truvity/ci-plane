---
# Source: ci-builders/templates/cache-redirect.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-redirect
  labels:
    app.kubernetes.io/name: cache-redirect
    app.kubernetes.io/part-of: ci-builders
spec:
  replicas: 2
  # Never take a ready pod away before its replacement is ready.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cache-redirect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cache-redirect
        app.kubernetes.io/part-of: ci-builders
    spec:
      serviceAccountName: cache-redirect
      enableServiceLinks: false
      # One replica per node: what a burst of misses costs is the network
      # of the node a pod runs on, so two pods on one node buy nothing.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cache-redirect
      # The preStop sleep (drainDelaySeconds) runs first, then shutdown
      # waits up to 25s for in-flight pull-throughs; an upload cut off past
      # that is aborted, never committed half-written. The grace period
      # must cover both.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532 # distroless nonroot
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cache-redirect
          image: ghcr.io/truvity/ci-plane/cache-redirect:latest
          args:
            - -listen=:8080
            - "-s3-bucket=example-bucket"
            - "-s3-region=eu-example-1"
            - "-presign-ttl=5m"
            - "-nix=true"
            - "-nix-prefix=nix/"
            - "-nix-upstream=https://cache.nixos.org"
            - "-nix-priority=30"
            - "-goproxy=true"
            - "-goproxy-prefix=goproxy/"
            - "-goproxy-upstream=https://proxy.golang.org"
            - "-goproxy-sumdb=sum.golang.org"
            - "-goproxy-sumdb-upstream=https://sum.golang.org"
            - "-maven=true"
            - "-maven-prefix=maven/"
            - "-gradle=false"
          ports:
            - name: http
              containerPort: 8080
          # Keep serving while the endpoint is removed from the Service
          # (kube-proxy and the like lag a few seconds behind the pod
          # going Terminating); only then does SIGTERM close the listener.
          # The native sleep action needs no shell (the image has none):
          # Kubernetes 1.30+ (beta, on by default; GA in 1.34).
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

---
# Source: ci-builders/templates/buildkitd.yaml
# Rootless BuildKit: no privileged securityContext. The unconfined
# seccomp profile is the documented rootless-buildkit requirement —
# user-namespace isolation replaces the default profile, which blocks
# the unprivileged clone/mount syscalls rootless depends on.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: buildkitd-arm64
  labels:
    app.kubernetes.io/name: buildkitd
    app.kubernetes.io/part-of: ci-builders
spec:
  serviceName: buildkitd-arm64
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkitd
      ci-plane.io/arch: arm64
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkitd
        app.kubernetes.io/part-of: ci-builders
        ci-plane.io/arch: arm64
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Rootless buildkit needs user namespaces; the default sysctl
        # ceiling on minimal hosts is too low.
        - name: enable-userns
          image: docker.io/library/busybox:1.38
          command: ["sysctl", "-w", "user.max_user_namespaces=63359"]
          securityContext:
            privileged: true
      containers:
        - name: buildkitd
          image: docker.io/moby/buildkit:v0.33.0-rootless
          args:
            - --addr
            - tcp://0.0.0.0:1234
            - --oci-worker-no-process-sandbox
            - --oci-max-parallelism=4
          ports:
            - name: grpc
              containerPort: 1234
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: Unconfined
          readinessProbe:
            exec:
              # --addr: buildctl defaults to the unix socket; the daemon
              # listens on TCP for the runners.
              command: ["buildctl", "--addr", "tcp://127.0.0.1:1234", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            limits:
              ephemeral-storage: 10Gi
              memory: 6Gi
            requests:
              cpu: 1000m
              ephemeral-storage: 2Gi
              memory: 4Gi
          volumeMounts:
            - name: cache
              mountPath: /home/user/.local/share/buildkit
  volumeClaimTemplates:
    - metadata:
        name: cache
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi

