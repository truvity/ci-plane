# Source: ci-builders/templates/cache-redirect.yaml
# Only the listed consumer namespaces may reach the service; a redirect
# then sends them to the bucket, which this policy does not govern.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cache-redirect-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cache-redirect
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arc-runners-example
      ports:
        - port: 8080
          protocol: TCP

