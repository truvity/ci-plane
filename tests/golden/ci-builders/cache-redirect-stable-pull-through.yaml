# Only the listed consumer namespaces may reach the builders.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: buildkitd-arm64-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: buildkitd
      ci-plane.io/arch: arm64
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: arc-runners-example
      ports:
        - port: 1234
          protocol: TCP

