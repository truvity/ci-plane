# Source: arc-runners/templates/nix-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: runner-nix-config-f3023255fffb
  labels:
    app.kubernetes.io/name: runner-nix-config
    app.kubernetes.io/part-of: gha-rs
data:
  nix.conf: |
    filetransfer-retry-attempts = 8
    filetransfer-retry-delay = 5000
    filetransfer-retry-delay-rate-limited = 10000
    filetransfer-retry-max-delay = 60000
    filetransfer-retry-jitter = true
    connect-timeout = 30
    stalled-download-timeout = 300
    builders = @/etc/nix-builders/machines
    builders-use-substitutes = true
    
  machines.template: |-
    
    ssh-ng://nix@nix-worker-amd64.example.svc.cluster.local x86_64-linux /home/runner/.ssh/nix-builder 2 1 - -
    ssh-ng://nix@nix-worker-arm64.example.svc.cluster.local aarch64-linux /home/runner/.ssh/nix-builder 2 1 - -
  ssh_config: |-
    Host nix-worker-amd64.example.svc.cluster.local nix-worker-arm64.example.svc.cluster.local
      BatchMode yes
      IdentitiesOnly yes
      IdentityFile /home/runner/.ssh/nix-builder
      CertificateFile /home/runner/.ssh/nix-builder-cert.pub
      UserKnownHostsFile /home/runner/.ssh/known_hosts
      StrictHostKeyChecking yes
      PasswordAuthentication no
      KbdInteractiveAuthentication no
  openbao-ca.crt: |-
    test
  ssh-user-ca.pub: |-
    ssh-ed25519 AAAATEST
  job-started.sh: |-
    #!/bin/bash
    set -u
    machines="${NIX_BUILDER_MACHINES_DIR}/machines"
    disable_remote() {
      rm -f "${NIX_BUILDER_SSH_DIR}/nix-builder" \
            "${NIX_BUILDER_SSH_DIR}/nix-builder.pub" \
            "${NIX_BUILDER_SSH_DIR}/nix-builder-cert.pub" 2>/dev/null
      : > "$machines" 2>/dev/null || rm -f "$machines" 2>/dev/null
    }
    if ! timeout 120 /usr/local/bin/nix-worker-client-setup; then
      disable_remote
    fi
    if [ -s "$machines" ]; then
      echo "nix builders: signed a fresh certificate for this job; remote builders enabled"
    else
      echo "nix builders: no certificate for this job; Nix builds locally"
    fi
    exit 0
  # A quoted FLOW scalar, not a `|-` block: a block scalar still emits an
  # indent-only line when certAuthorities is empty, and the setup
  # binary's "is this file non-empty" check would then see whitespace
  # instead of "nothing to append" -- the same trap ci-builders' worker
  # principals ConfigMap documents. Default empty renders "", a
  # genuinely zero-byte file, so an unmigrated install appends nothing.
  known-hosts-cert-authorities: "@cert-authority *.example.svc.cluster.local ssh-ed25519 AAAACA"
immutable: true

