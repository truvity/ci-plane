            # the job's first step (see arc-runners.nixJobStartedHook). The
            # init container's certificate covers only a job that starts
            # within the hour; a warm pod outlives it.
            - name: ACTIONS_RUNNER_HOOK_JOB_STARTED
              value: /var/run/nix-builder-config/job-started.sh
            - name: NIX_BUILDER_SSH_DIR
              value: /home/runner/.ssh
            - name: NIX_BUILDER_MACHINES_DIR
              value: /etc/nix-builders
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: NIX_BUILDER_OPENBAO_ADDRESS
              value: "https://openbao.example"
            - name: NIX_BUILDER_OPENBAO_NAMESPACE
              value: "example"
            - name: NIX_BUILDER_OPENBAO_AUTH_MOUNT
              value: "jwt-example"
            - name: NIX_BUILDER_OPENBAO_AUTH_ROLE
              value: "ci-nix"
            - name: NIX_BUILDER_OPENBAO_SSH_MOUNT
              value: "ssh"
            - name: NIX_BUILDER_OPENBAO_SSH_ROLE
              value: "ci-nix"
            - name: NIX_BUILDER_CERTIFICATE_TTL
              value: "1h"
            - name: NIX_BUILDER_REQUEST_TIMEOUT
              value: "15s"
            - name: NIX_BUILDER_PRINCIPAL
              value: "ci-nix"
            - name: NIX_BUILDER_PROTOCOL
              value: "ssh-ng"
            - name: NIX_BUILDER_KNOWN_HOSTS_PINNED
              value: "false"
          resources:
            limits:
              cpu: "2"
              ephemeral-storage: 20Gi
              memory: 6Gi
            requests:
              cpu: "1"
              memory: 6Gi
          # Writable by `runner` (the init container chowns both emptyDirs to
          # it): the job-started hook replaces the key, certificate and
          # machines file. The projected token is here for the same hook, so
          # workflow code can read it too — see docs/architecture.md.
          volumeMounts:
            - name: nix-builder-config
              mountPath: /var/run/nix-builder-config
              readOnly: true
            - name: nix-builder-openbao-token
              mountPath: /var/run/secrets/openbao
              readOnly: true
            - name: nix-builder-ssh
              mountPath: /home/runner/.ssh
            - name: nix-builders
              mountPath: /etc/nix-builders
      volumes:
        - name: nix-builder-config
          configMap:
            name: runner-nix-config-f3023255fffb
            items:
              - key: machines.template
                path: machines.template
              - key: ssh_config
                path: ssh_config
              - key: openbao-ca.crt
                path: openbao-ca.crt
              - key: ssh-user-ca.pub
                path: ssh-user-ca.pub
              - key: job-started.sh
                path: job-started.sh
                mode: 0555
              - key: known-hosts-cert-authorities
                path: known-hosts-cert-authorities
        # 0444: the runner container runs as `runner`, not root, and its
        # job-started hook must read the token. The boundary is which
        # containers mount it, not the mode: every process in the runner
        # container is the job's own user.
        - name: nix-builder-openbao-token
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  audience: "openbao"
                  expirationSeconds: 600
                  path: token
        - name: nix-builder-ssh
          emptyDir: {}
        - name: nix-builders
          emptyDir: {}
