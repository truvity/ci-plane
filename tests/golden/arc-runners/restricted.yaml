---
# Source: arc-runners/templates/janitor.yaml
# arc-runner-janitor: sweeps ephemeral runners stranded by upstream ARC
# bug actions/actions-runner-controller#4307. GitHub hands each queued
# job to a runner as a MESSAGE that can be acquired once; when a job is
# cancelled or interrupted, the acquiring runner fails to clean up and
# every later runner logs "Job message already acquired" or "job
# assignment is invalid", then idles forever. The queue stalls beside
# idle capacity — a signature that reads like a capacity problem and is
# not one. Namespace-scoped RBAC; deletes ONLY runners that (a) hold no
# job, (b) match a stuck signature, (c) are older than the grace
# period. Remove when #4307 ships a fix.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-runner-janitor
  labels:
    app.kubernetes.io/name: arc-runner-janitor
    app.kubernetes.io/part-of: arc-runners

---
# Source: arc-runners/templates/janitor.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: arc-runner-janitor-v2
data:
  sweep.sh: |
    #!/bin/sh
    set -eu
    GRACE_SECONDS=180
    NOW=$(date -u +%s)
    STUCK='Job message already acquired|job assignment is invalid|invalid job assignment'
    swept=0

    # jq converts the timestamp, not `date`: the image is Alpine, so
    # `date` is BusyBox, and BusyBox cannot parse ISO-8601 with -d.
    # jq's fromdateiso8601 is exact and jq is already a dependency.
    # Collected first, then fed to the loop by HEREDOC rather than by a
    # pipe. A piped `while` runs in a subshell, so `swept` would be
    # incremented in a process that exits before anything reads it and the
    # count at the end would always be 0 -- a number that is worse than no
    # number, because it looks like an answer. POSIX sh has no process
    # substitution, and the root filesystem is read-only, so a heredoc is
    # the way to keep the loop in this shell.
    idle=$(kubectl get ephemeralrunners -n example -o json \
      | jq -r '.items[] | select((.status.jobRepositoryName // "") == "")
               | "\(.metadata.name)\t\(.metadata.creationTimestamp|fromdateiso8601)"')

    while IFS="$(printf '\t')" read -r name created_epoch; do
        [ -z "$name" ] && continue
        age=$(( NOW - created_epoch ))
        if [ "$age" -lt "$GRACE_SECONDS" ]; then
          echo "skip $name: age ${age}s < grace"
          continue
        fi
        # Read the runner's own log; a pod that is gone or starting has none.
        if kubectl logs -n example "$name" --tail=200 2>/dev/null \
             | grep -qE "$STUCK"; then
          echo "STUCK $name (age ${age}s, no job, signature matched) — deleting"
          kubectl delete ephemeralrunner -n example "$name" --wait=false || true
          swept=$((swept+1))
        else
          echo "ok $name (age ${age}s, idle, no signature)"
        fi
      done <<SWEEP_IDLE
    $idle
    SWEEP_IDLE

    # ── second signature: stuck in DELETION ──────────────────────────────
    #
    # The sweep above cannot see this class, and deliberately so: it skips
    # any runner that holds a job, and these hold one. Observed on
    # truvity 2026-09-24, where it stalled the whole org's CI until a
    # person stripped the finalizers by hand.
    #
    # The shape: a runner's JIT registration is SINGLE-USE. If its first
    # start fails for any reason -- on that day, the CNI could not assign
    # the pod an IP -- every restart afterwards is refused with
    # "Registration ... was not found", and the pod crash-loops. Deleting
    # it does not help, because the runner-registration finalizer exists
    # to deregister the runner from GitHub before the object may go, and
    # that cleanup cannot complete against a registration that is already
    # gone. So the object can neither run nor die, while still holding the
    # job GitHub assigned it. Nothing times out. The queue simply stops.
    #
    # Stripping the finalizer is safe for exactly the reason it is stuck:
    # the GitHub-side registration the finalizer wants to remove does not
    # exist. Nothing is orphaned by letting the object go.
    #
    # Gated on the deletion being OLDER than the grace period, so an
    # ordinary delete -- which completes in well under a second -- is
    # never touched. Only a deletion that has plainly stopped making
    # progress qualifies.
    wedged=$(kubectl get ephemeralrunners -n example -o json \
      | jq -r '.items[]
               | select(.metadata.deletionTimestamp != null)
               | select((.metadata.finalizers // []) | length > 0)
               | "\(.metadata.name)\t\(.metadata.deletionTimestamp|fromdateiso8601)"')

    while IFS="$(printf '\t')" read -r name deleted_epoch; do
        [ -z "$name" ] && continue
        age=$(( NOW - deleted_epoch ))
        if [ "$age" -lt "$GRACE_SECONDS" ]; then
          echo "skip $name: deleting for ${age}s < grace"
          continue
        fi
        echo "WEDGED $name (deleting for ${age}s, finalizers still set) — releasing"
        kubectl patch ephemeralrunner -n example "$name" \
          --type=merge -p '{"metadata":{"finalizers":null}}' || true
        swept=$((swept+1))
      done <<SWEEP_WEDGED
    $wedged
    SWEEP_WEDGED

    # Said out loud. A sweep that found nothing and a sweep that could not
    # see anything print the same empty output otherwise, and the second
    # is the one worth knowing about.
    echo "sweep complete ($swept released)"

