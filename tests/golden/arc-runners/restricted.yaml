# Source: arc-runners/templates/janitor.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arc-runner-janitor
rules:
  - apiGroups: ["actions.github.com"]
    resources: ["ephemeralrunners"]
    # `patch` is for the second sweep only, which strips a finalizer that
    # can never complete. It cannot create or edit a runner's spec.
    verbs: ["get", "list", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]

