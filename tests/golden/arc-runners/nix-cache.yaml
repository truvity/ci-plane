# Source: arc-runners/templates/janitor.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arc-runner-janitor
  labels:
    app.kubernetes.io/name: arc-runner-janitor
    app.kubernetes.io/part-of: arc-runners
spec:
  schedule: "*/3 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: arc-runner-janitor
          restartPolicy: Never
          enableServiceLinks: false
          containers:
            - name: sweep
              image: docker.io/alpine/k8s:1.37.0
              command: ["/bin/sh", "/scripts/sweep.sh"]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
              resources:
                limits:
                  memory: 128Mi
                requests:
                  cpu: 25m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: script
              configMap:
                name: arc-runner-janitor-v2
                defaultMode: 0555

