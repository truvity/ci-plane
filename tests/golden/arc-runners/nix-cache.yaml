# Source: arc-runners/templates/nix-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: runner-nix-config-df8643f062aa
  labels:
    app.kubernetes.io/name: runner-nix-config
    app.kubernetes.io/part-of: gha-rs
data:
  nix.conf: |
    filetransfer-retry-attempts = 8
    filetransfer-retry-delay = 5000
    filetransfer-retry-delay-rate-limited = 10000
    filetransfer-retry-max-delay = 60000
    filetransfer-retry-jitter = true
    connect-timeout = 30
    stalled-download-timeout = 300
    substituters = http://nix-cache.example.svc.cluster.local https://cache.nixos.org/
    
immutable: true

---
# Source: arc-runners/templates/janitor.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arc-runner-janitor
rules:
  - apiGroups: ["actions.github.com"]
    resources: ["ephemeralrunners"]
    # `patch` is for the second sweep only, which strips a finalizer that
    # can never complete. It cannot create or edit a runner's spec.
    verbs: ["get", "list", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]

