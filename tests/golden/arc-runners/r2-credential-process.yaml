---
# Source: arc-runners/templates/janitor.yaml
# arc-runner-janitor: sweeps ephemeral runners stranded by upstream ARC
# bug actions/actions-runner-controller#4307. GitHub hands each queued
# job to a runner as a MESSAGE that can be acquired once; when a job is
# cancelled or interrupted, the acquiring runner fails to clean up and
# every later runner logs "Job message already acquired" or "job
# assignment is invalid", then idles forever. The queue stalls beside
# idle capacity — a signature that reads like a capacity problem and is
# not one. Namespace-scoped RBAC; deletes ONLY runners that hold no job
# and either (a) match a stuck signature in their log and are older than
# the grace period, or (b) have a readiness probe (runner.watchdog) that
# has been failing for notReadySeconds. Runs every minute. Remove when
# #4307 ships a fix.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-runner-janitor
  labels:
    app.kubernetes.io/name: arc-runner-janitor
    app.kubernetes.io/part-of: arc-runners

---
# Source: arc-runners/templates/aws-config.yaml
# The AWS config PROFILE a `credential_process` line lives in — see
# values.yaml's awsConfig comment for what this exists for and the
# shadowing refusal it pairs with. Named, not content-addressed like
# runner-nix-config: unlike the nix machines file, a stale mount here
# costs a job one re-mint of a short-lived credential, not a build that
# silently used the wrong store, so a plain ConfigMap the kubelet
# refreshes in place is enough. A change still recycles every scale
# set's listener — templates/runnersets.yaml folds awsConfig into each
# set's values-hash — so a rotated `credentialProcess` line reaches warm
# runners the same way any other v4.2.0 hook does.
apiVersion: v1
kind: ConfigMap
metadata:
  name: runner-aws-config
  labels:
    app.kubernetes.io/name: runner-aws-config
    app.kubernetes.io/part-of: gha-rs
data:
  # AWS_CONFIG_FILE points here; AWS_PROFILE names the one profile inside
  # it (templates/runnersets.yaml, the runner container's env). The AWS
  # SDKs/CLI parse this as an ordinary INI file — this chart writes the
  # credentialProcess value after the `=` verbatim and does not parse it.
  config: |
    [profile ci-cache]
    credential_process = sluisctl cloudflare r2 example-ci-cache --file /var/run/secrets/cloudflare/example-ci-cache.json

