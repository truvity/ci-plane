apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  name: preview-large
  labels:
    app.kubernetes.io/name: preview-large
    app.kubernetes.io/instance: preview-large
    app.kubernetes.io/component: autoscaling-runner-set
    app.kubernetes.io/part-of: gha-rs
    # The controller's compatibility gate — see values.arcVersion.
    app.kubernetes.io/version: "0.14.2"
    actions.github.com/organization: example
    actions.github.com/scale-set-name: preview-large
    actions.github.com/scale-set-namespace: example
  annotations:
    actions.github.com/runner-group-name: Default
    actions.github.com/runner-scale-set-name: preview-large
    actions.github.com/cleanup-manager-role-name: preview-large-gha-rs-manager
    actions.github.com/cleanup-manager-role-binding: preview-large-gha-rs-manager
    actions.github.com/values-hash: 2dc1209135c4436e095b2dda8d5f8b3b082483124d465d701143202ef1edb8c
spec:
  githubConfigUrl: https://github.com/example
  githubConfigSecret: arc-github-app
  runnerGroup: Default
  minRunners: 1
  maxRunners: 8
  listenerTemplate:
    spec:
      # Every listener runs on the Pod Security `restricted` profile,
      # whatever the set's `restricted` key says (that key is for the runner
      # pods). The image's own user is numeric, so runAsNonRoot is checkable.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: listener
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  template:
    metadata:
      # Pod-template labels reach the runner pod verbatim; this one is
      # what every runner's packing affinity looks for (values.packing).
      labels:
        ci-plane.io/packing-group: runners
    spec:
      automountServiceAccountToken: false
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  ci-plane.io/packing-group: runners
              namespaceSelector: {}
              topologyKey: kubernetes.io/hostname
            weight: 100
      initContainers:
        - command:
          - "true"
          image: busybox
          name: warm-something
      containers:
        - name: runner
          image: ghcr.io/truvity/ci-plane/runner:latest
          command: ["/home/runner/run.sh"]
          env:
            - name: GOMAXPROCS
              value: "4"
            - name: NIX_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: runner-nix-config-df8643f062aa
                  key: nix.conf
            # JOB-scoped, not CLIENT-scoped: an ephemeral runner's `runner`
            # container is the one place every step of ONE job runs, so
            # AWS_PROFILE here is the default for any `aws`/SDK call that
            # job makes, not only the Go cache client this exists for. A
            # step that needs a DIFFERENT AWS identity in the same job sets
            # its own AWS_PROFILE (or --profile) to override this default,
            # exactly as it would override any other environment default.
            # See values.yaml's awsConfig comment for the render-time
            # refusal that catches the opposite direction: a static
            # AWS_ACCESS_KEY_ID left in extraEnv, which would silently
            # outrank this profile rather than the other way around.
            - name: AWS_CONFIG_FILE
              value: /var/run/aws-config/config
            - name: AWS_PROFILE
              value: "ci-cache"
          resources:
            limits:
              cpu: "4"
              ephemeral-storage: 40Gi
              memory: 24Gi
            requests:
              cpu: "2"
              memory: 24Gi
          volumeMounts:
            - name: aws-config
              mountPath: /var/run/aws-config
              readOnly: true
            - name: extra-tokens
              mountPath: /var/run/secrets/tokens
              readOnly: true
            - mountPath: /var/run/secrets/cloudflare
              name: cloudflare-r2
              readOnly: true
            - mountPath: /var/run/scratch
              name: scratch
      volumes:
        - name: aws-config
          configMap:
            name: runner-aws-config
        # 0444: read by whatever job-side code the estate points at this
        # path, not only root — same reasoning as nix-builder-openbao-token
        # above. ONE volume, several sources: the kubelet projects every
        # source of one projected volume into the same directory, which is
        # exactly why two entries may not share a `path` (refused above).
        - name: extra-tokens
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  audience: "example-service"
                  path: "example-service-token"
                  expirationSeconds: 3600
        - name: cloudflare-r2
          secret:
            items:
            - key: document
              path: example-ci-cache.json
            secretName: example-ci-cache-r2
        - emptyDir: {}
          name: scratch

