# Source: arc-runners/templates/runnersets.yaml
apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  name: nix-builder-arm64
  labels:
    app.kubernetes.io/name: nix-builder-arm64
    app.kubernetes.io/instance: nix-builder-arm64
    app.kubernetes.io/component: autoscaling-runner-set
    app.kubernetes.io/part-of: gha-rs
    # The controller's compatibility gate — see values.arcVersion.
    app.kubernetes.io/version: "0.14.2"
    actions.github.com/organization: example
    actions.github.com/scale-set-name: nix-builder-arm64
    actions.github.com/scale-set-namespace: example
  annotations:
    actions.github.com/runner-group-name: Default
    actions.github.com/runner-scale-set-name: nix-builder-arm64
    actions.github.com/cleanup-manager-role-name: nix-builder-arm64-gha-rs-manager
    actions.github.com/cleanup-manager-role-binding: nix-builder-arm64-gha-rs-manager
    actions.github.com/values-hash: 0f5bc0868dbb512b5751ed3aec210c62bfe8bb8145097be8da29d70ba0394ff
spec:
  githubConfigUrl: https://github.com/example
  githubConfigSecret: arc-github-app
  runnerGroup: Default
  minRunners: 0
  maxRunners: 1
  listenerTemplate:
    spec:
      # Every listener runs on the Pod Security `restricted` profile,
      # whatever the set's `restricted` key says (that key is for the runner
      # pods). The image's own user is numeric, so runAsNonRoot is checkable.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: listener
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  template:
    metadata:
      # Pod-template labels reach the runner pod verbatim; this one is
      # what every runner's packing affinity looks for (values.packing).
      labels:
        ci-plane.io/packing-group: runners
    spec:
      hostUsers: false
      nodeSelector:
        kubernetes.io/hostname: hive-8
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  ci-plane.io/packing-group: runners
              namespaceSelector: {}
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
        - name: runner
          image: ghcr.io/truvity/ci-plane/runner:latest
          command: ["/home/runner/run.sh"]
          # procMount/seccomp are the container-level half of nixSandbox;
          # hostUsers above is the pod-level half. Baseline pod security
          # allows procMount: Unmasked only because hostUsers is false
          # (Kubernetes >=1.35's check_procMount_baseline.go) -- the two
          # always render together, never one without the other. The
          # profile itself must already exist on every node this set can
          # land on (docs/nix-sandbox.md, hack/gen-nix-sandbox-seccomp.sh)
          # and, ideally, be fenced so only this set's pods can name it
          # (values.nixSandbox.fence.enabled) -- baseline PSA allows ANY
          # Localhost profile to ANY pod on the node that has the file.
          securityContext:
            procMount: Unmasked
            seccompProfile:
              type: Localhost
              localhostProfile: "profiles/nix-sandbox.json"
          env:
            - name: GOMAXPROCS
              value: "4"
            - name: NIX_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: runner-nix-config-eaf2b093c138
                  key: nix.conf
          resources:
            limits:
              cpu: "8"
              ephemeral-storage: 80Gi
              memory: 16Gi
            requests:
              cpu: "4"
              memory: 16Gi

