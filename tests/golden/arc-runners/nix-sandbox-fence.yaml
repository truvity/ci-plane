# Source: arc-runners/templates/nix-sandbox-fence.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  # Cluster-scoped, so the name carries the release: two organizations'
  # releases in the same cluster must not collide or overwrite each
  # other's fence.
  name: arc-runners-nix-sandbox-fence
  labels:
    app.kubernetes.io/part-of: gha-rs
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers, replicationcontrollers]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets, replicasets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  variables:
    - name: isPod
      expression: object.kind == 'Pod'
    - name: spec
      expression: >-
        variables.isPod ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec
    - name: containers
      expression: >-
        variables.spec.containers
        + variables.spec.?initContainers.orValue([])
        + variables.spec.?ephemeralContainers.orValue([])
  validations:
    # nix-builder-arm64: only a Pod in example carrying
    # this set's scale-set label, with hostUsers: false, may name
    # profiles/nix-sandbox.json.
    - expression: >-
        !(
          variables.spec.?securityContext.?seccompProfile.?localhostProfile.orValue('').contains('profiles/nix-sandbox.json')
          || variables.containers.exists(c, c.?securityContext.?seccompProfile.?localhostProfile.orValue('').contains('profiles/nix-sandbox.json'))
        ) || (
          variables.isPod
          && request.namespace == 'example'
          && object.metadata.?labels[?'actions.github.com/scale-set-name'].orValue('') == 'nix-builder-arm64'
          && object.spec.?hostUsers.orValue(true) == false
        )
      messageExpression: >-
        'seccomp profile profiles/nix-sandbox.json is reserved for example/nix-builder-arm64 runner pods with hostUsers: false; refused on '
        + object.kind + ' ' + request.namespace + '/' + object.metadata.?name.orValue(object.metadata.?generateName.orValue(''))
      reason: Forbidden

---
# Source: arc-runners/templates/nix-sandbox-fence.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: arc-runners-nix-sandbox-fence
spec:
  policyName: arc-runners-nix-sandbox-fence
  validationActions: [Deny]
