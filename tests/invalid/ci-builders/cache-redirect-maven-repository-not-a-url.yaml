# refuses: /cacheRedirect/maven/repositories
# An upstream is an http(s) base URL.
buildkitd:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
npmCache:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
cacheRedirect:
  enabled: true
  s3:
    bucket: example-bucket
    region: eu-example-1
  maven:
    repositories:
      central: repo.maven.apache.org
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
