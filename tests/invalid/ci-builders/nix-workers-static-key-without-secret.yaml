# refuses: nixWorkers.ssh.existingSecret is required when nixWorkers.hostCertificate.enabled is false
# The static-key path with no Secret to read the key from: v5.0.0 has no
# default Secret name any more.
buildkitd:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
npmCache:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
nixWorkers:
  enabled: true
  ssh:
    trustedUserCAKeys:
      - ssh-ed25519 AAAATEST
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
  hostCertificate:
    enabled: false
