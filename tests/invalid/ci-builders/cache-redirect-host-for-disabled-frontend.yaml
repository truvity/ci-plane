# refuses: a host name for a front-end that is off
# A host is named for the Gradle build cache, which is off by default.
buildkitd:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
npmCache:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
cacheRedirect:
  enabled: true
  s3:
    bucket: example-bucket
    region: eu-example-1
  hosts:
    gradle: gradle.cache.example.test
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
