# refuses: /cacheRedirect/npm/registry
# The registry is an http(s) base URL.
buildkitd:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
npmCache:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
cacheRedirect:
  enabled: true
  s3:
    bucket: example-bucket
    region: eu-example-1
  npm:
    enabled: true
    registry: registry.npmjs.org
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
