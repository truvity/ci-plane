# refuses: externalClients needs clientCA.create: true
buildkitd:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
  mtls:
    enabled: true
    serverCertificate:
      issuerRef: {name: example-private}
      dnsNames:
        arm64: [a.example.private]
        amd64: [b.example.private]
    clientCA:
      requesterNamespaces: [arc-runners-example]
      create: false
      externalClients:
        outside: {commonName: ci-runner-outside}
npmCache:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
nixWorkers:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
