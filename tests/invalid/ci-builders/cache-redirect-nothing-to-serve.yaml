# refuses: there is nothing to serve
# Every front-end off (the Gradle build cache is off by default).
buildkitd:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
npmCache:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
cacheRedirect:
  enabled: true
  s3:
    bucket: example-bucket
    region: eu-example-1
  nix:
    enabled: false
  goproxy:
    enabled: false
  maven:
    enabled: false
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
