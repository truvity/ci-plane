# refuses: consumerNamespaces
# A module proxy that admits nobody cannot work, and an estate fact has
# no default: enabling it without naming the runner namespaces fails.
buildkitd:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
npmCache:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
goModproxy:
  enabled: true
  s3:
    bucket: example-bucket
    region: eu-example-1
