# refuses: a host name for a front-end that is off
# A host is named for the npm registry, which is off unless asked for (a
# preset turns it on; this fixture lists none).
buildkitd:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
npmCache:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
cacheRedirect:
  enabled: true
  s3:
    bucket: example-bucket
    region: eu-example-1
  hosts:
    npm: npm.cache.example.test
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
