# refuses: serverCertificate.dnsNames.amd64 is required
buildkitd:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
  mtls:
    enabled: true
    serverCertificate:
      issuerRef: {name: example-private}
      dnsNames:
        arm64: [a.example.private]
npmCache:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
nixWorkers:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
