# refuses: retirePlain does not apply with mtls.mode inPlace
buildkitd:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
  mtls:
    enabled: true
    mode: inPlace
    retirePlain: true
    serverCertificate:
      issuerRef:
        name: example-private
      dnsNames:
        arm64: [buildkitd-arm64.example.private]
        amd64: [buildkitd-amd64.example.private]
    clientCA:
      create: true
      requesterNamespaces: [arc-runners-example]
npmCache:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
nixWorkers:
  networkPolicy:
    consumerNamespaces: [arc-runners-example]
