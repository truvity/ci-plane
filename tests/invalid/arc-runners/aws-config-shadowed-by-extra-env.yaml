# refuses: silently keep winning over the one credential_process mints
# awsConfig on, and extraEnv also names AWS_ACCESS_KEY_ID: the AWS SDK's
# credential chain checks environment variables before a config file's
# credential_process, so the static key would win over the minted one
# and the new profile would never be consulted -- exactly the migration
# this feature exists for, silently not happening.
githubConfigUrl: https://github.com/example
controllerServiceAccount:
  namespace: arc-system
extraEnv:
  - name: AWS_ACCESS_KEY_ID
    value: AKIAEXAMPLE
awsConfig:
  enabled: true
  profile: ci-cache
  credentialProcess: "sluisctl cloudflare r2 example-ci-cache"
