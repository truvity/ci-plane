{{- if .Values.npmCache.enabled }}
{{- $n := .Values.npmCache }}
---
# npm-cache (verdaccio): read-through proxy of registry.npmjs.org.
# Metadata is short-TTL'd, tarballs cached forever on a disposable PVC
# — a CACHE by doctrine: no backups, losing it costs a re-warm.
# Public packages only: publish denied, registration off, no uplink
# credentials. Consumers reach it as an ordinary registry
# (npmRegistryServer: http://npm-cache.<ns>.svc) behind a health-probe
# fallback to upstream.
apiVersion: v1
kind: ConfigMap
metadata:
  # Version suffix: bump on ANY config edit — the Deployment references
  # the versioned name, so the bump is what rolls the pod.
  name: npm-cache-config-v1
  labels:
    app.kubernetes.io/name: npm-cache
    app.kubernetes.io/part-of: ci-cache
data:
  config.yaml: |
    storage: /verdaccio/storage
    # Registration disabled; nothing authenticates, nothing publishes.
    auth:
      htpasswd:
        file: /verdaccio/storage/htpasswd
        max_users: -1
    uplinks:
      npmjs:
        url: https://registry.npmjs.org/
        cache: true
    packages:
      '**':
        access: $all
        proxy: npmjs
        # no publish/unpublish rule -> denied for everyone
    server:
      keepAliveTimeout: 60
    web:
      enable: true
      title: ci npm cache
    log:
      type: stdout
      format: pretty
      level: warn
    listen: 0.0.0.0:4873
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: npm-cache-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storageClassName }}
  resources:
    requests:
      storage: {{ $n.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: npm-cache
  labels:
    app.kubernetes.io/name: npm-cache
    app.kubernetes.io/part-of: ci-cache
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: npm-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: npm-cache
        app.kubernetes.io/part-of: ci-cache
    spec:
      enableServiceLinks: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # verdaccio uid in the official image
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verdaccio
          image: {{ include "ci-cache.image" $n.image }}
          args: ["--config", "/verdaccio/conf/config.yaml"]
          ports:
            - name: http
              containerPort: 4873
          volumeMounts:
            - name: conf
              mountPath: /verdaccio/conf
              readOnly: true
            - name: data
              mountPath: /verdaccio/storage
          readinessProbe:
            httpGet:
              path: /-/ping
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml $n.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: conf
          configMap:
            name: npm-cache-config-v1
        - name: data
          persistentVolumeClaim:
            claimName: npm-cache-data
---
apiVersion: v1
kind: Service
metadata:
  name: npm-cache
  labels:
    app.kubernetes.io/name: npm-cache
    app.kubernetes.io/part-of: ci-cache
spec:
  selector:
    app.kubernetes.io/name: npm-cache
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if $n.networkPolicy.enabled }}
---
# Only the listed consumer namespaces may reach the cache.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: npm-cache-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: npm-cache
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- range $ns := $n.networkPolicy.consumerNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
        {{- end }}
      ports:
        - port: 4873
          protocol: TCP
{{- end }}
{{- end }}
