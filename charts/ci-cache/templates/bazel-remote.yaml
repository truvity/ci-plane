{{- if .Values.bazelRemote.enabled }}
{{- $z := .Values.bazelRemote }}
---
# bazel-remote: a Bazel Remote Execution v2 API cache (moon's remote
# task cache speaks it; moon has no native S3). Disk-backed: zero IAM,
# cluster-local latency; it is a CACHE, losing it costs one cold
# rebuild.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazel-remote-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storageClassName }}
  resources:
    requests:
      storage: {{ $z.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazel-remote
  labels:
    app.kubernetes.io/name: bazel-remote
    app.kubernetes.io/part-of: ci-cache
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: bazel-remote
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bazel-remote
        app.kubernetes.io/part-of: ci-cache
    spec:
      # The Service is named bazel-remote → k8s service links inject
      # BAZEL_REMOTE_PORT=tcp://ip:8080, which the binary parses as its
      # OWN --port env flag and crashes. Kill service-link envs.
      enableServiceLinks: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bazel-remote
          image: {{ include "ci-cache.image" $z.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --dir=/data
            - --max_size={{ $z.maxSizeGb }}
            - --port=8080
            - --grpc_port=9092
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9092
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml $z.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bazel-remote-data
---
apiVersion: v1
kind: Service
metadata:
  name: bazel-remote
  labels:
    app.kubernetes.io/name: bazel-remote
    app.kubernetes.io/part-of: ci-cache
spec:
  selector:
    app.kubernetes.io/name: bazel-remote
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9092
      targetPort: grpc
{{- end }}
