apiVersion: v2
name: ci-cache
description: >-
  The in-cluster CI cache plane for ARC runners: daemonless buildkit
  builders (per-arch), a nix read-through cache, a Go module proxy and
  a Bazel-API remote cache. Every component is a CACHE by doctrine —
  disposable storage, no backups; losing one costs a re-warm.
type: application
# version and appVersion are stamped by the release workflow; the
# committed values are placeholders that helm lint accepts.
version: 0.0.0-dev
appVersion: 0.0.0-dev
home: https://github.com/truvity/ci-plane
sources:
  - https://github.com/truvity/ci-plane
