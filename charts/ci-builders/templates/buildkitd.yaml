{{- /*
buildkitd.mtls.mode "inPlace" turns THESE builders (the buildkitd-<arch>
StatefulSets, their Services and cache volumes) into the TLS ones: the
server certificate and client CA are mounted, --tlscert/--tlskey/--tlscacert
are set and the plain tcp listener is gone (buildkitd applies its TLS
settings to every tcp:// listener, so it cannot serve both). The unix
socket stays, for the readiness probe. The default "parallel" renders the
plain builders as before and the TLS ones beside them (buildkitd-mtls.yaml).
*/ -}}
{{- $mtlsInPlace := and .Values.buildkitd.mtls.enabled (eq (.Values.buildkitd.mtls.mode | default "parallel") "inPlace") }}
{{- if and $mtlsInPlace .Values.buildkitd.mtls.retirePlain }}{{ fail "buildkitd.mtls.retirePlain does not apply with mtls.mode inPlace: there is no plain builder to retire, the builders themselves serve TLS" }}{{ end }}
{{- if and .Values.buildkitd.mtls.retirePlain (not .Values.buildkitd.mtls.enabled) }}{{ fail "buildkitd.mtls.retirePlain needs buildkitd.mtls.enabled: retiring the plain builders with no TLS ones would leave the runners no builder at all" }}{{ end }}
{{- if and .Values.buildkitd.enabled (not .Values.buildkitd.mtls.retirePlain) }}
{{- $b := .Values.buildkitd }}
{{- /* buildkitd.size (values.sizes): its resources and maxParallelism replace
     the component's own. A copy, so the release-wide values stay as given. */}}
{{- if $b.size }}
{{- $b = deepCopy $b }}
{{- range $k, $v := (include "ci-builders.sizeOf" (dict "root" $ "size" $b.size "name" "buildkitd") | fromJson) }}
{{- if has $k (list "resources" "maxParallelism") }}{{ $_ := set $b $k $v }}
{{- else }}{{ fail (printf "sizes.%s.%s does not apply to buildkitd (it takes resources and maxParallelism)" $b.size $k) }}{{ end }}
{{- end }}
{{- end }}
{{- $tlsDir := "/etc/buildkit/tls" }}
{{- $caDir := "/etc/buildkit/client-ca" }}
{{- range $arch := $b.archs }}
{{- $secret := printf "buildkitd-mtls-%s-tls" $arch }}
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd-{{ $arch }}
  labels:
    app.kubernetes.io/name: buildkitd
    app.kubernetes.io/part-of: ci-builders
spec:
  selector:
    app.kubernetes.io/name: buildkitd
    ci-plane.io/arch: {{ $arch }}
  ports:
    - name: grpc
      port: 1234
      targetPort: 1234
---
# Rootless BuildKit: no privileged securityContext. The unconfined
# seccomp profile is the documented rootless-buildkit requirement —
# user-namespace isolation replaces the default profile, which blocks
# the unprivileged clone/mount syscalls rootless depends on.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: buildkitd-{{ $arch }}
  labels:
    app.kubernetes.io/name: buildkitd
    app.kubernetes.io/part-of: ci-builders
  {{- if and $mtlsInPlace $b.mtls.reloader.enabled }}
  annotations:
    # stakater/Reloader: buildkitd reads its certificate once, at start, so
    # a renewed server certificate (or a replaced client CA) restarts the pod.
    secret.reloader.stakater.com/reload: {{ $secret }}
    configmap.reloader.stakater.com/reload: {{ $b.mtls.clientCA.configMapName }}
  {{- end }}
spec:
  serviceName: buildkitd-{{ $arch }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buildkitd
      ci-plane.io/arch: {{ $arch }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buildkitd
        app.kubernetes.io/part-of: ci-builders
        ci-plane.io/arch: {{ $arch }}
      {{- with $b.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- $sched := (index $b.scheduling $arch) | default dict }}
      {{- $placement := include "ci-builders.placement" (dict "root" $ "sched" $sched "arch" $arch) | fromJson }}
      {{- with $placement.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $placement.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Rootless buildkit needs user namespaces; the default sysctl
        # ceiling on minimal hosts is too low.
        - name: enable-userns
          image: {{ include "ci-builders.image" $b.initImage }}
          command: ["sysctl", "-w", "user.max_user_namespaces=63359"]
          securityContext:
            privileged: true
      containers:
        - name: buildkitd
          image: {{ include "ci-builders.image" $b.image }}
          args:
            - --addr
            - tcp://0.0.0.0:1234
            {{- if $mtlsInPlace }}
            - --addr
            - unix:///run/user/1000/buildkit/buildkitd.sock
            - --tlscert
            - {{ $tlsDir }}/tls.crt
            - --tlskey
            - {{ $tlsDir }}/tls.key
            - --tlscacert
            - {{ $caDir }}/ca.crt
            {{- end }}
            - --oci-worker-no-process-sandbox
            {{- if $b.maxParallelism }}
            - {{ printf "--oci-max-parallelism=%d" (int $b.maxParallelism) }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: 1234
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: Unconfined
          {{- /* The unix socket, which buildkitd leaves plain when it serves TLS: the tcp://
               listener demands a client certificate. Otherwise --addr names the TCP
               listener: buildctl defaults to the unix socket, and the daemon listens on
               TCP for the runners. */}}
          {{- $probeAddr := ternary "unix:///run/user/1000/buildkit/buildkitd.sock" "tcp://127.0.0.1:1234" $mtlsInPlace }}
          {{- include "ci-builders.buildkitdProbes" (dict "probes" $b.probes "addr" $probeAddr) | trim | nindent 10 }}
          resources:
            {{- toYaml $b.resources | nindent 12 }}
          volumeMounts:
            - name: cache
              mountPath: /home/user/.local/share/buildkit
            {{- if $mtlsInPlace }}
            - name: tls
              mountPath: {{ $tlsDir }}
              readOnly: true
            - name: client-ca
              mountPath: {{ $caDir }}
              readOnly: true
            {{- end }}
      {{- if $mtlsInPlace }}
      volumes:
        - name: tls
          secret:
            secretName: {{ $secret }}
            defaultMode: 0440
        - name: client-ca
          configMap:
            name: {{ $b.mtls.clientCA.configMapName }}
            items:
              - key: ca.crt
                path: ca.crt
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: cache
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $.Values.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $b.cacheSize }}
{{- if $b.networkPolicy.enabled }}
---
# Only the listed consumer namespaces may reach the builders.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: buildkitd-{{ $arch }}-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: buildkitd
      ci-plane.io/arch: {{ $arch }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- range $ns := $b.networkPolicy.consumerNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
        {{- end }}
      ports:
        - port: 1234
          protocol: TCP
{{- end }}
{{- end }}
{{- end }}
