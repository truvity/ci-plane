{{- /*
Keys this chart no longer honours.

A chart that quietly ignores a value the caller still sets is the worst
shape an upgrade can take: helm reports success, argo reports Synced,
and the feature the caller asked for is simply gone. Renaming the chart
makes that failure MORE likely, not less, because a caller porting
their values from `ci-cache` to `ci-builders` is already editing this
file and will carry the old block across.

So each removed key fails the render and says where the feature went.
The check is hasKey, not truthiness: `nixWorkers.accounts.nixremote:
false` is still a caller who believes the legacy login exists.
*/ -}}
{{- if hasKey ((.Values.nixWorkers | default dict).accounts | default dict) "nixremote" }}
{{- fail "ci-builders 5.0.0 removed `nixWorkers.accounts.nixremote`: the legacy `nixremote` login (nix-store --serve) and its shim are gone from the worker image, and `nix` over ssh-ng is the only machine login. Delete the nixremote block from your values; runners connect as nixBuilders.login.user=nix, principal ci-nix, protocol ssh-ng (arc-runners 5.0.0's defaults)." }}
{{- end }}
