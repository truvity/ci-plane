{{- if .Values.nixWorkers.enabled }}
{{- $n := .Values.nixWorkers }}
{{- if not $n.ssh.existingSecret }}{{ fail "nixWorkers.ssh.existingSecret is required when nixWorkers is enabled" }}{{ end }}
{{- if not $n.ssh.hostPrivateKeyKey }}{{ fail "nixWorkers.ssh.hostPrivateKeyKey is required when nixWorkers is enabled" }}{{ end }}
{{- if not $n.ssh.trustedUserCAKeys }}{{ fail "nixWorkers.ssh.trustedUserCAKeys is required when nixWorkers is enabled" }}{{ end }}
{{- range $key := $n.ssh.trustedUserCAKeys }}{{ if not ($key | trim) }}{{ fail "nixWorkers.ssh.trustedUserCAKeys may not contain an empty key" }}{{ end }}{{ end }}
{{- if not $n.archs }}{{ fail "nixWorkers.archs is required when nixWorkers is enabled" }}{{ end }}
{{- if le (int $n.maxJobs) 0 }}{{ fail "nixWorkers.maxJobs must be positive" }}{{ end }}
{{- if le (int $n.cores) 0 }}{{ fail "nixWorkers.cores must be positive" }}{{ end }}
{{- /* nixWorkers.accounts.nixremote.enabled: false together with an
     empty accounts.nix.principals would leave this worker with NO
     machine login at all -- neither account could ever be reached. */}}
{{- if and (not $n.accounts.nixremote.enabled) (not $n.accounts.nix.principals) }}{{ fail "nixWorkers.accounts.nixremote.enabled is false and nixWorkers.accounts.nix.principals is empty: this worker would have no machine login at all" }}{{ end }}
{{- /* opkssh (the people pilot). archs is an allow-list INTO
     $n.archs, not a parallel list of its own -- naming an architecture
     this worker does not run is always a mistake, never a wider render.
     issuer/clientId are required the moment archs is non-empty: an
     enabled worker with neither would bake an AllowUsers/nix.conf
     change onto accounts nobody's token could ever reach, which is a
     worse silent-no-op than the render simply refusing. nixGroup/
     adminGroup are NOT required here -- a worker piloting `admin` alone
     (or `nix` alone) is a valid, intentional shape. */}}
{{- range $arch := $n.opkssh.archs }}
{{- if not (has $arch $n.archs) }}{{ fail (printf "nixWorkers.opkssh.archs names %q, which is not in nixWorkers.archs" $arch) }}{{ end }}
{{- end }}
{{- if $n.opkssh.archs }}
{{- if not $n.opkssh.issuer }}{{ fail "nixWorkers.opkssh.issuer is required when nixWorkers.opkssh.archs is non-empty" }}{{ end }}
{{- if not $n.opkssh.clientId }}{{ fail "nixWorkers.opkssh.clientId is required when nixWorkers.opkssh.archs is non-empty" }}{{ end }}
{{- end }}
{{- /* INF host-certificates phase 1. Validated the same way as
     arc-runners' nixBuilders.openbao.certificateTTL: a whole number of
     s/m/h, converted to seconds so renewEvery can be compared against it
     -- a renewal at or after the certificate's own TTL is a worker that
     goes unreachable between the moment the old certificate expires and
     the moment the (never-run) renewal would have replaced it. */}}
{{- if $n.hostCertificate.enabled }}
{{- if not $n.openbao.address }}{{ fail "nixWorkers.openbao.address is required when nixWorkers.hostCertificate is enabled" }}{{ end }}
{{- if not $n.openbao.caBundle }}{{ fail "nixWorkers.openbao.caBundle is required when nixWorkers.hostCertificate is enabled" }}{{ end }}
{{- if not $n.openbao.namespace }}{{ fail "nixWorkers.openbao.namespace is required when nixWorkers.hostCertificate is enabled" }}{{ end }}
{{- if not $n.openbao.authMount }}{{ fail "nixWorkers.openbao.authMount is required when nixWorkers.hostCertificate is enabled: the OpenBao JWT/Kubernetes auth mount the workers log in on (one per environment); there is no default because a wrong mount fails every login into a worker with no host certificate at all" }}{{ end }}
{{- if not $n.openbao.authRole }}{{ fail "nixWorkers.openbao.authRole is required when nixWorkers.hostCertificate is enabled" }}{{ end }}
{{- if not $n.openbao.audience }}{{ fail "nixWorkers.openbao.audience is required when nixWorkers.hostCertificate is enabled" }}{{ end }}
{{- if not $n.openbao.hostSshMount }}{{ fail "nixWorkers.openbao.hostSshMount is required when nixWorkers.hostCertificate is enabled" }}{{ end }}
{{- if not $n.openbao.hostSshRole }}{{ fail "nixWorkers.openbao.hostSshRole is required when nixWorkers.hostCertificate is enabled" }}{{ end }}
{{- if not $n.openbao.requestTimeout }}{{ fail "nixWorkers.openbao.requestTimeout is required when nixWorkers.hostCertificate is enabled" }}{{ end }}
{{- if not $n.serviceAccount.name }}{{ fail "nixWorkers.serviceAccount.name is required when nixWorkers.hostCertificate is enabled" }}{{ end }}
{{- $ttl := toString $n.hostCertificate.certificateTTL }}
{{- if not (regexMatch "^[0-9]+[smh]$" $ttl) }}{{ fail (printf "nixWorkers.hostCertificate.certificateTTL %q must be a whole number of s, m or h (e.g. 24h)" $ttl) }}{{ end }}
{{- $renew := toString $n.hostCertificate.renewEvery }}
{{- if not (regexMatch "^[0-9]+[smh]$" $renew) }}{{ fail (printf "nixWorkers.hostCertificate.renewEvery %q must be a whole number of s, m or h (e.g. 12h)" $renew) }}{{ end }}
{{- $unitSeconds := dict "s" 1 "m" 60 "h" 3600 }}
{{- $ttlSeconds := mul (int (regexFind "^[0-9]+" $ttl)) (get $unitSeconds (regexFind "[smh]$" $ttl)) }}
{{- $renewSeconds := mul (int (regexFind "^[0-9]+" $renew)) (get $unitSeconds (regexFind "[smh]$" $renew)) }}
{{- if ge (int $renewSeconds) (int $ttlSeconds) }}{{ fail (printf "nixWorkers.hostCertificate.renewEvery %q must be less than certificateTTL %q: a renewal at or after the certificate's own lifetime leaves the worker unreachable between expiry and the (too-late) renewal" $renew $ttl) }}{{ end }}
{{- $minRemaining := toString $n.hostCertificate.minRemaining }}
{{- if not (regexMatch "^[0-9]+[smh]$" $minRemaining) }}{{ fail (printf "nixWorkers.hostCertificate.minRemaining %q must be a whole number of s, m or h (e.g. 2h)" $minRemaining) }}{{ end }}
{{- $minRemainingSeconds := mul (int (regexFind "^[0-9]+" $minRemaining)) (get $unitSeconds (regexFind "[smh]$" $minRemaining)) }}
{{- if ge (int $minRemainingSeconds) (int $ttlSeconds) }}{{ fail (printf "nixWorkers.hostCertificate.minRemaining %q must be less than certificateTTL %q" $minRemaining $ttl) }}{{ end }}
{{- end }}
{{- $trustedCAs := join "\n" $n.ssh.trustedUserCAKeys }}
{{- $caName := printf "nix-worker-trusted-user-ca-%s" ($trustedCAs | sha256sum | trunc 12) }}
{{- $principalsName := printf "nix-worker-principals-%s" (join "," $n.accounts.nix.principals | sha256sum | trunc 12) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $caName }}
  labels:
    app.kubernetes.io/name: nix-worker
    app.kubernetes.io/part-of: ci-builders
data:
  trusted_user_ca_keys: |-
    {{- $trustedCAs | nindent 4 }}
immutable: true
---
# AuthorizedPrincipalsFile content for the `nix` SSH login
# (nixWorkers.accounts.nix.principals). Content-addressed like the CA
# ConfigMap above, so changing the list rotates the object rather than
# mutating an immutable one in place. Rendered even with an EMPTY list:
# the file then exists and is empty, which is what
# nix-worker-entrypoint.sh reads as "nobody" -- an absent mount would read
# the same way, but an always-present file keeps the container's
# behaviour independent of whether this ConfigMap happens to exist.
#
# Mounted at /etc/nix-worker/principals-src (below), NOT at the path
# sshd is told to trust: Kubernetes' ConfigMap volume plugin makes the
# mount directory 0777 and every file in it a symlink through a
# timestamped `..data` directory, which OpenSSH's StrictModes refuses
# for an AuthorizedPrincipalsFile path. nix-worker-entrypoint.sh copies
# this content into a root-owned directory with strict modes at
# container startup; image/sshd_config's `Match User nix` block names
# that copy, not this mount.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $principalsName }}
  labels:
    app.kubernetes.io/name: nix-worker
    app.kubernetes.io/part-of: ci-builders
data:
  # A quoted FLOW scalar, deliberately not a `|-` block: a block scalar
  # still emits an indent-only line for an EMPTY list, and
  # nix-worker-entrypoint.sh's `[[ -s file ]]` would then see that
  # whitespace as "non-empty" and read it as "principals configured" --
  # exactly backwards from the default this key exists to protect
  # (default empty -> nobody). `quote` on an empty join renders "", which
  # mounts as a genuinely zero-byte file.
  nix: {{ join "\n" $n.accounts.nix.principals | quote }}
immutable: true
---
# /etc/opk/{providers,auth_id} content for opkssh (the people pilot).
# ONE ConfigMap shared by every architecture -- the identity
# content itself (issuer, client id, the two groups) does not vary by
# arch, only WHICH arch's container actually copies it in ever does
# (NIX_WORKER_OPKSSH_ENABLED below, set per-arch from opkssh.archs).
# Content-addressed and rendered even when opkssh.archs is empty, same
# reasoning as the principals ConfigMap above: an absent mount would
# read the same way as an empty one, but an always-present object keeps
# the container's own behaviour independent of whether this happens to
# exist, and a later `helm diff` on JUST opkssh.archs never touches this
# object at all.
{{- $opksshProviders := "" }}
{{- if $n.opkssh.issuer }}{{ $opksshProviders = printf "%s %s %s" $n.opkssh.issuer $n.opkssh.clientId $n.opkssh.expiration }}{{ end }}
{{- $opksshAuthIdLines := list }}
{{- if $n.opkssh.nixGroup }}{{ $opksshAuthIdLines = append $opksshAuthIdLines (printf "nix oidc:groups:%s %s" $n.opkssh.nixGroup $n.opkssh.issuer) }}{{ end }}
{{- if $n.opkssh.adminGroup }}{{ $opksshAuthIdLines = append $opksshAuthIdLines (printf "admin oidc:groups:%s %s" $n.opkssh.adminGroup $n.opkssh.issuer) }}{{ end }}
{{- $opksshAuthId := join "\n" $opksshAuthIdLines }}
{{- $opksshName := printf "nix-worker-opkssh-%s" (list $opksshProviders $opksshAuthId | join "|" | sha256sum | trunc 12) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $opksshName }}
  labels:
    app.kubernetes.io/name: nix-worker
    app.kubernetes.io/part-of: ci-builders
data:
  # Quoted FLOW scalars, for the same "empty must mount zero bytes, not
  # a whitespace line" reason as the principals ConfigMap's `nix` key.
  providers: {{ $opksshProviders | quote }}
  auth_id: {{ $opksshAuthId | quote }}
immutable: true
{{- if $n.hostCertificate.enabled }}
{{- if $n.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $n.serviceAccount.name }}
  labels:
    app.kubernetes.io/name: nix-worker
    app.kubernetes.io/part-of: ci-builders
{{- end }}
---
# OpenBao's HTTPS issuer CA, decoded once and shared by every
# architecture's worker (they all sign against the same OpenBao route).
apiVersion: v1
kind: ConfigMap
metadata:
  name: nix-worker-openbao-ca
  labels:
    app.kubernetes.io/name: nix-worker
    app.kubernetes.io/part-of: ci-builders
data:
  ca.crt: |-
    {{- $n.openbao.caBundle | b64dec | nindent 4 }}
{{- end }}
{{- range $arch := $n.archs }}
{{- $opksshOnArch := has $arch $n.opkssh.archs }}
---
apiVersion: v1
kind: Service
metadata:
  name: nix-worker-{{ $arch }}
  labels:
    app.kubernetes.io/name: nix-worker
    app.kubernetes.io/part-of: ci-builders
    ci-plane.io/arch: {{ $arch }}
spec:
  selector:
    app.kubernetes.io/name: nix-worker
    ci-plane.io/arch: {{ $arch }}
  ports:
    - name: ssh
      port: 22
      targetPort: ssh
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nix-worker-{{ $arch }}
  labels:
    app.kubernetes.io/name: nix-worker
    app.kubernetes.io/part-of: ci-builders
    ci-plane.io/arch: {{ $arch }}
spec:
  serviceName: nix-worker-{{ $arch }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nix-worker
      ci-plane.io/arch: {{ $arch }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nix-worker
        app.kubernetes.io/part-of: ci-builders
        ci-plane.io/arch: {{ $arch }}
      annotations:
        # The principals ConfigMap is content-addressed ($principalsName
        # above), so its own name already changes the pod template on a
        # values change -- but the checksum is kept explicit anyway: it
        # is the thing that actually documents, and guards, the intent
        # that a nixWorkers.accounts.nix.principals edit must roll the
        # StatefulSet. AllowUsers and the copied principals file
        # (nix-worker-entrypoint.sh) are both decided once at container
        # startup, never re-read live, so a running pod's ability to
        # reach `nix` at all is fixed until it restarts.
        checksum/nix-worker-principals: {{ join "," $n.accounts.nix.principals | sha256sum }}
        # Same reasoning, for opkssh's own two files: whether THIS arch
        # copies them in is fixed at container start
        # (NIX_WORKER_OPKSSH_ENABLED below), so a provider/group edit --
        # or flipping this arch in or out of opkssh.archs -- must roll
        # the StatefulSet too. Keyed on the arch's own opkssh state, not
        # just the shared ConfigMap's content: two identical ConfigMaps
        # can still mean different things to an on-list vs. an off-list
        # arch.
        checksum/nix-worker-opkssh: {{ printf "%s:%s:%s:%s:%t" $n.opkssh.issuer $n.opkssh.clientId $n.opkssh.nixGroup $n.opkssh.adminGroup $opksshOnArch | sha256sum }}
        {{- with $n.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if $n.hostCertificate.enabled }}
      serviceAccountName: {{ $n.serviceAccount.name }}
      {{- end }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- $sched := (index $n.scheduling $arch) | default dict }}
      {{- if $sched.nodeSelector }}
      nodeSelector:
        {{- toYaml $sched.nodeSelector | nindent 8 }}
      {{- else }}
      nodeSelector:
        kubernetes.io/arch: {{ $arch }}
        {{- with $.Values.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- if $sched.tolerations }}
      tolerations:
        {{- toYaml $sched.tolerations | nindent 8 }}
      {{- else }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      initContainers:
        - name: seed-store
          image: {{ include "ci-builders.nixWorkerImage" $ }}
          command: ["/usr/local/bin/nix-worker-seed"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: store
              mountPath: /seed/nix
            - name: runtime
              mountPath: /runtime
      containers:
        - name: nix-worker
          image: {{ include "ci-builders.nixWorkerImage" $ }}
          command: ["/usr/bin/tini", "--", "/usr/local/bin/nix-worker-entrypoint"]
          env:
            - name: NIX_WORKER_MAX_JOBS
              value: {{ $n.maxJobs | quote }}
            - name: NIX_WORKER_CORES
              value: {{ $n.cores | quote }}
            - name: NIX_WORKER_MIN_FREE_BYTES
              value: {{ $n.minFreeBytes | quote }}
            - name: NIX_WORKER_MAX_FREE_BYTES
              value: {{ $n.maxFreeBytes | quote }}
            - name: NIX_WORKER_ACCOUNTS_NIX_TRUSTED
              value: {{ $n.accounts.nix.trusted | quote }}
            - name: NIX_WORKER_ACCOUNTS_NIXREMOTE_ENABLED
              value: {{ $n.accounts.nixremote.enabled | quote }}
            # opkssh (the people pilot): true only for the
            # architecture(s) named in nixWorkers.opkssh.archs -- every
            # other arch's container gets "false" and renders exactly as
            # it did before this feature existed, even though it shares
            # the same image and the same opkssh-src ConfigMap.
            - name: NIX_WORKER_OPKSSH_ENABLED
              value: {{ $opksshOnArch | quote }}
            {{- if $n.hostCertificate.enabled }}
            - name: NIX_WORKER_HOST_CERTIFICATE_ENABLED
              value: "true"
            - name: NIX_WORKER_HOST_CERTIFICATE_RENEW_EVERY
              value: {{ $n.hostCertificate.renewEvery | quote }}
            - name: NIX_WORKER_HOST_CERTIFICATE_MIN_REMAINING
              value: {{ $n.hostCertificate.minRemaining | quote }}
            - name: NIX_WORKER_CERTIFICATE_TTL
              value: {{ $n.hostCertificate.certificateTTL | quote }}
            - name: NIX_WORKER_OPENBAO_ADDRESS
              value: {{ $n.openbao.address | quote }}
            - name: NIX_WORKER_OPENBAO_NAMESPACE
              value: {{ $n.openbao.namespace | quote }}
            - name: NIX_WORKER_OPENBAO_AUTH_MOUNT
              value: {{ $n.openbao.authMount | quote }}
            - name: NIX_WORKER_OPENBAO_AUTH_ROLE
              value: {{ $n.openbao.authRole | quote }}
            - name: NIX_WORKER_OPENBAO_SSH_MOUNT
              value: {{ $n.openbao.hostSshMount | quote }}
            - name: NIX_WORKER_OPENBAO_SSH_ROLE
              value: {{ $n.openbao.hostSshRole | quote }}
            - name: NIX_WORKER_REQUEST_TIMEOUT
              value: {{ $n.openbao.requestTimeout | quote }}
            - name: NIX_WORKER_HOST_PRINCIPALS
              value: {{ include "ci-builders.nixWorkerHostPrincipal" (dict "arch" $arch "namespace" $.Release.Namespace) | quote }}
            {{- end }}
          ports:
            - name: ssh
              containerPort: 2222
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            privileged: true
            readOnlyRootFilesystem: true
          startupProbe:
            exec:
              command: ["/usr/local/bin/nix-worker-healthcheck"]
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            exec:
              # --readiness, on THIS probe alone: it is the only one of
              # the three that may watch the host certificate's
              # remaining life (image/nix-worker-healthcheck.sh) --
              # startupProbe/livenessProbe below stay identical to
              # before so a stalled renewal loop never kills a pod that
              # still serves under a still-valid certificate.
              command: ["/usr/local/bin/nix-worker-healthcheck", "--readiness"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/usr/local/bin/nix-worker-healthcheck"]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml $n.resources | nindent 12 }}
          volumeMounts:
            - name: store
              mountPath: /nix
            - name: runtime
              mountPath: /run/nix-worker
            - name: build
              mountPath: /build
            - name: tmp
              mountPath: /tmp
            - name: ssh
              mountPath: /etc/nix-worker/ssh
              readOnly: true
            - name: trusted-user-ca
              mountPath: /etc/nix-worker/ca
              readOnly: true
            - name: principals
              mountPath: /etc/nix-worker/principals-src
              readOnly: true
            - name: opkssh-src
              mountPath: /etc/nix-worker/opkssh-src
              readOnly: true
            # /etc/opk backed by a real (writable) emptyDir, shadowing
            # the image's own placeholder directory: readOnlyRootFilesystem
            # above means opkssh's hardcoded /etc/opk/{providers,auth_id}
            # paths could never be written at container start otherwise
            # (image/nix-worker-entrypoint.sh does that write, every
            # arch, regardless of NIX_WORKER_OPKSSH_ENABLED -- see that
            # script for why leaving it unmounted is not an option).
            - name: opk
              mountPath: /etc/opk
            {{- if $n.hostCertificate.enabled }}
            - name: openbao-token
              mountPath: /var/run/secrets/openbao
              readOnly: true
            - name: openbao-ca
              mountPath: /var/run/nix-worker-openbao
              readOnly: true
            {{- end }}
      volumes:
        - name: runtime
          emptyDir: {}
        - name: build
          emptyDir:
            sizeLimit: {{ $n.buildDirSize }}
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: ssh
          secret:
            secretName: {{ $n.ssh.existingSecret }}
            defaultMode: 0400
            items:
              - key: {{ $n.ssh.hostPrivateKeyKey }}
                path: ssh_host_ed25519_key
        - name: trusted-user-ca
          configMap:
            name: {{ $caName }}
            defaultMode: 0444
        - name: principals
          configMap:
            name: {{ $principalsName }}
            defaultMode: 0444
        - name: opkssh-src
          configMap:
            name: {{ $opksshName }}
            defaultMode: 0444
        - name: opk
          emptyDir:
            sizeLimit: 1Mi
        {{- if $n.hostCertificate.enabled }}
        - name: openbao-token
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  audience: {{ $n.openbao.audience | quote }}
                  expirationSeconds: {{ $n.serviceAccount.tokenExpirationSeconds }}
                  path: token
        - name: openbao-ca
          configMap:
            name: nix-worker-openbao-ca
            defaultMode: 0444
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: store
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ $.Values.storageClassName }}
        resources:
          requests:
            storage: {{ $n.storeSize }}
{{- if $n.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nix-worker-{{ $arch }}-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nix-worker
      ci-plane.io/arch: {{ $arch }}
  policyTypes: ["Ingress"]
  {{- if $n.networkPolicy.consumerNamespaces }}
  ingress:
    - from:
        {{- range $ns := $n.networkPolicy.consumerNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
        {{- end }}
      ports:
        - port: 2222
          protocol: TCP
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
