{{- if .Values.nixCache.enabled }}
{{- $n := .Values.nixCache }}
---
# nix-cache: transparent read-through cache of the nix upstream,
# consumed as an ordinary HTTP SUBSTITUTER — not an HTTP_PROXY (a
# forward proxy only sees CONNECT tunnels for HTTPS and can cache
# nothing without MITM). Runners list this service before the upstream
# in nix.conf; pod down = fall through to upstream: slower, never
# broken. A CACHE on a disposable PVC — zero IAM, no backups.
apiVersion: v1
kind: ConfigMap
metadata:
  # Version suffix: bump on ANY nginx.conf edit — the Deployment
  # references the versioned name, so the bump is what rolls the pod
  # (GitOps engines never restart pods on in-place ConfigMap changes).
  name: nix-cache-nginx-v3
  labels:
    app.kubernetes.io/name: nix-cache
    app.kubernetes.io/part-of: ci-builders
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      access_log off;
      # Writable paths for a non-root, read-only-rootfs container.
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /cache/tmp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      # max_size is enforced by LRU eviction; the slack below the PVC
      # size absorbs temp files and eviction lag. inactive far above
      # any real reuse window — eviction is size-driven here.
      proxy_cache_path /cache/nix levels=1:2 keys_zone=nix:64m
                       max_size={{ $n.maxSize }} inactive=90d use_temp_path=off;

      # Resolve the CDN continuously and expose every current address
      # as an upstream peer. This keeps DNS rotation (the variable
      # proxy_pass used by v2) while also giving proxy_next_upstream a
      # different peer to try after a connection error or retryable 5xx.
      resolver {{ $n.resolver }} valid=300s ipv6=off;
      upstream nixos_cache {
        zone nixos_cache 64k;
        server {{ $n.upstream }}:443 resolve;
      }

      server {
        listen 8080;

        location = /healthz { return 200; }

        # Advertise a BETTER priority than the upstream we proxy.
        # Nix chooses a substituter by the Priority in its
        # nix-cache-info (LOWER wins), not by the order they appear in
        # `substituters`. Proxying upstream's own nix-cache-info
        # returned Priority 40 -- a tie with cache.nixos.org, which nix
        # broke toward upstream. This cache therefore served almost
        # nothing while runners pulled ~155 GB/day straight from Fastly
        # (INF-621). StoreDir MUST match the upstream's or nix rejects
        # the substituter outright.
        location = /nix-cache-info {
          default_type text/x-nix-cache-info;
          return 200 "StoreDir: /nix/store\nWantMassQuery: 1\nPriority: 10\n";
        }

        location / {
          proxy_pass https://nixos_cache;
          proxy_set_header Host {{ $n.upstream }};
          proxy_ssl_server_name on;
          proxy_ssl_name {{ $n.upstream }};
          proxy_http_version 1.1;
          proxy_set_header Connection "";

          # Bound each network phase independently. A healthy CDN
          # stream should never go a minute without a byte; failing
          # there leaves enough of the four-minute aggregate budget to
          # try the other resolved peers.
          proxy_connect_timeout 30s;
          proxy_send_timeout 1m;
          proxy_read_timeout 1m;
          # Retry an idempotent cache GET against another resolved CDN
          # peer. OSS nginx has no delayed backoff; Nix supplies that
          # outer retry curve through the runner NIX_CONFIG.
          proxy_next_upstream error timeout invalid_header
                              http_500 http_502 http_503 http_504;
          proxy_next_upstream_tries 4;
          proxy_next_upstream_timeout 4m;

          proxy_cache nix;
          proxy_cache_key $uri;
          # Deterministic TTLs, upstream headers ignored: store paths
          # are content-addressed, so both .narinfo and nar/* are
          # immutable in practice. 404s are cached briefly — nix
          # probes many nonexistent narinfos per closure.
          proxy_ignore_headers Cache-Control Expires;
          proxy_cache_valid 200 90d;
          proxy_cache_valid 404 5m;
          # Collapse a cold fleet's concurrent misses for the same
          # path into ONE upstream fetch in the normal case. A waiter
          # falls through after four minutes—before Nix's five-minute
          # idle timeout—while lock_age prevents another request from
          # taking over cache population for ten minutes.
          proxy_cache_lock on;
          proxy_cache_lock_timeout 4m;
          proxy_cache_lock_age 10m;
          # Refresh an expired object in the background while clients
          # receive the stale copy. Explicit HTTP statuses matter: an
          # upstream-generated 504 is neither a transport `error` nor
          # nginx's own `timeout`.
          proxy_cache_background_update on;
          proxy_cache_use_stale error timeout invalid_header updating
                                http_500 http_502 http_503 http_504;
          add_header X-Cache $upstream_cache_status always;
        }
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nix-cache-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storageClassName }}
  resources:
    requests:
      storage: {{ $n.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nix-cache
  labels:
    app.kubernetes.io/name: nix-cache
    app.kubernetes.io/part-of: ci-builders
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO PVC
  selector:
    matchLabels:
      app.kubernetes.io/name: nix-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nix-cache
        app.kubernetes.io/part-of: ci-builders
    spec:
      enableServiceLinks: false
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: nginx
          image: {{ include "ci-builders.image" $n.image }}
          command: ["nginx", "-c", "/etc/nginx-cache/nginx.conf", "-g", "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx-cache
              readOnly: true
            - name: data
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml $n.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101 # nginx uid in the official alpine image
            capabilities:
              drop: ["ALL"]
      securityContext:
        fsGroup: 101
      volumes:
        - name: conf
          configMap:
            name: nix-cache-nginx-v3
        - name: data
          persistentVolumeClaim:
            claimName: nix-cache-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nix-cache
  labels:
    app.kubernetes.io/name: nix-cache
    app.kubernetes.io/part-of: ci-builders
spec:
  selector:
    app.kubernetes.io/name: nix-cache
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
