{{- if .Values.goModproxy.enabled }}
{{- $g := .Values.goModproxy }}
{{- if not $g.s3.bucket }}{{ fail "goModproxy.s3.bucket is required when goModproxy is enabled" }}{{ end }}
---
# go-modproxy: go-cache-plugin `serve --modproxy` -- a caching Go module
# + sumdb proxy backed by an S3 prefix. Runners set GOPROXY to this
# service. Whether a missing proxy fails the job or falls through to
# proxy.golang.org is the CONSUMER's choice of separator in GOPROXY: a
# comma falls through only on 404/410 (a down proxy fails loudly), a
# pipe falls through on any error (a down proxy goes unnoticed).
#
# The pod runs the RUNNER IMAGE itself — it bakes the go-cache-plugin
# binary. S3 access is the pod's own identity: the ServiceAccount is
# expected to carry pod-identity/IRSA wiring (estate-side) scoped to
# the keyPrefix and nothing else. Local staging is an emptyDir — S3 is
# the durable layer.
{{- if $g.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $g.serviceAccount.name }}
  labels:
    app.kubernetes.io/name: go-modproxy
    app.kubernetes.io/part-of: ci-builders
  {{- with $g.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-modproxy
  labels:
    app.kubernetes.io/name: go-modproxy
    app.kubernetes.io/part-of: ci-builders
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: go-modproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-modproxy
        app.kubernetes.io/part-of: ci-builders
      {{- with $g.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $g.serviceAccount.name }}
      enableServiceLinks: false
      {{- $placement := include "ci-builders.placement" (dict "root" $) | fromJson }}
      {{- with $placement.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $placement.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: go-modproxy
          image: {{ include "ci-builders.runnerImage" $ }}
          command: ["go-cache-plugin", "serve"]
          env:
            # serve is fully env-driven. --plugin is mandatory but
            # listens on 127.0.0.1 only — nothing consumes it here; the
            # HTTP modproxy is the product.
            - name: GOCACHE_PLUGIN
              value: "5930"
            - name: GOCACHE_HTTP
              value: ":5970"
            - name: GOCACHE_MODPROXY
              value: "true"
            - name: GOCACHE_SUMDB
              value: {{ $g.sumdb | quote }}
            - name: GOCACHE_DIR
              value: /data
            - name: GOCACHE_S3_BUCKET
              value: {{ $g.s3.bucket | quote }}
            - name: GOCACHE_S3_REGION
              value: {{ $g.s3.region | quote }}
            - name: GOCACHE_KEY_PREFIX
              value: {{ $g.s3.keyPrefix | quote }}
            {{- with $g.s3.endpoint }}
            # Only when set: an empty endpoint would be taken literally by
            # the SDK rather than falling back to the AWS default.
            - name: GOCACHE_S3_ENDPOINT_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if $g.s3.pathStyle }}
            - name: GOCACHE_S3_PATH_STYLE
              value: "true"
            {{- end }}
          {{- with $g.s3.existingSecret }}
          # A store with no pod identity supplies keys here. envFrom rather
          # than named env so a session token is carried too, without the
          # chart having to name every variable the SDK may read.
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          ports:
            - name: http
              containerPort: 5970
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml $g.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001 # runner uid in the runner image
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          emptyDir:
            sizeLimit: {{ $g.stagingSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: go-modproxy
  labels:
    app.kubernetes.io/name: go-modproxy
    app.kubernetes.io/part-of: ci-builders
spec:
  selector:
    app.kubernetes.io/name: go-modproxy
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if $g.networkPolicy.enabled }}
---
# Only the listed consumer namespaces may reach the proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: go-modproxy-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: go-modproxy
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- range $ns := $g.networkPolicy.consumerNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
        {{- end }}
      ports:
        - port: 5970
          protocol: TCP
{{- end }}
{{- end }}
