# Preset: the STABLE tier's builder and cache plane. Opt in by listing it
# before your own values (Argo CD: `helm.valueFiles:
# [presets/stable.yaml]`). A later values file wins key by key.
#
# Shape: pull-through caches only (no bazel-remote, no npm cache) and
# buildkitd per
# architecture on a pool it shares with other workloads. The builders
# share small nodes, so the chart's own memory limit stays: a limit above
# the node would turn a cgroup OOM into node pressure. The preset names no
# node pool, label or taint of a platform; it refers to NAMES that you
# define in your own values:
#
#   nodeClasses.builders-arm64     where buildkitd-arm64 goes
#   nodeClasses.builders-amd64     where buildkitd-amd64 goes
#   nodeClasses.cache-plane        where the caches go (`{}` for nowhere
#                                  in particular)
#
# The chart adds `kubernetes.io/arch` to a builder's selector itself. The
# chart refuses to render with a name undefined. A platform's own pod
# annotations and storage class are not here: see presets/karpenter.yaml.
# Estate facts are never in a preset.
nodeClass: cache-plane
buildkitd:
  maxParallelism: 4
  scheduling:
    arm64:
      nodeClass: builders-arm64
    amd64:
      nodeClass: builders-amd64
bazelRemote:
  enabled: false
npmCache:
  enabled: false
