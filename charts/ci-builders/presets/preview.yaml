# Preset: the PREVIEW tier's builder and cache plane. Opt in by listing
# it before your own values (Argo CD: `helm.valueFiles:
# [presets/preview.yaml]`). A later values file wins key by key.
#
# Shape: buildkitd on a dedicated on-demand AWS/Karpenter pool named
# `build` (both arches; a spot reclaim kills a build with two minutes'
# notice, which do-not-disrupt cannot stop), with a 10Gi limit that pool's
# nodes can hold; all caches on. nodeSelector/tolerations/scheduling
# REPLACE when overridden. Estate facts -- registries, namespaces that may
# consume, the Go module proxy's bucket -- are never in a preset.
storageClassName: gp3
tolerations:
  - key: arch
    operator: Exists
buildkitd:
  maxParallelism: 4
  podAnnotations:
    karpenter.sh/do-not-disrupt: "true"
  resources:
    limits:
      memory: 10Gi
  scheduling:
    arm64:
      nodeSelector:
        karpenter.sh/nodepool: build
        kubernetes.io/arch: arm64
        karpenter.sh/capacity-type: on-demand
      tolerations:
        - key: build
          value: "true"
          effect: NoSchedule
    amd64:
      nodeSelector:
        karpenter.sh/nodepool: build
        kubernetes.io/arch: amd64
        karpenter.sh/capacity-type: on-demand
      tolerations:
        - key: build
          value: "true"
          effect: NoSchedule
bazelRemote:
  enabled: true
npmCache:
  enabled: true
goModproxy:
  # A restart mid-job fails the jobs that meet it (GOPROXY uses a comma):
  # off voluntary disruption. Inert while goModproxy.enabled is false.
  podAnnotations:
    karpenter.sh/do-not-disrupt: "true"
