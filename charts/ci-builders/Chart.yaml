apiVersion: v2
name: ci-builders
description: >-
  The in-cluster build and cache plane for ARC runners: daemonless
  buildkit builders and nix remote workers (both per-arch), plus the
  nix, npm and Bazel-API caches they and the runners read through.
  Every component is DISPOSABLE — no backups; losing one costs a
  re-warm. The Go module proxy used to live here and is now
  truvity/ci-cache.
type: application
# Placeholders: the git tag is the sole version authority. The release
# workflow (.github/workflows/release.yaml) overwrites both fields from
# the tag before it packages the chart.
version: 0.0.0
appVersion: 0.0.0
home: https://github.com/truvity/ci-plane
sources:
  - https://github.com/truvity/ci-plane
