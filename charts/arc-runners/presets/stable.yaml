# Preset: the STABLE tier -- the release-build plane. Opt in by listing
# it before your own values (Argo CD: `helm.valueFiles:
# [presets/stable.yaml]`; Helm: `-f presets/stable.yaml -f mine.yaml`).
# A values file you pass later wins key by key.
#
# Shape: ONE fat, cold scale set named `stable` (minimum 0, at most 2
# runners); the chart ships no other set, so nothing is deleted. The preset names no node pool, label or number of a platform; it
# refers to NAMES that you define in your own values:
#
#   nodeClasses.stable-runners     where the runners go (`{}` for
#                                  nowhere in particular)
#   sizes.large                    the stable runner's requests/limits and
#                                  GOMAXPROCS
#
# The chart refuses to render with a name undefined. Estate facts -- the
# organization, the registry, the runner ServiceAccount -- are never in a
# preset.
minRunners: 0
maxRunners: 2
nodeClass: stable-runners
scaleSets:
  stable:
    size: large
    minRunners: 0
    maxRunners: 2
