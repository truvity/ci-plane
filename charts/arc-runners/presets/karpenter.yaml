# Preset (opt-in): the Karpenter assumptions. List it, with a tier preset
# or alone, ONLY where Karpenter (or EKS Auto Mode, which runs it)
# provisions the runners' nodes. Nothing else in this chart assumes it.
#
# A runner mid-job is not migratable state: node consolidation cancels the
# run. This annotation tells Karpenter to leave a node alone while a
# runner is on it (it stops consolidation, not a spot reclaim: run CI
# pools on-demand). The pool labels and taints are not here: they are your
# `nodeClasses`.
podAnnotations:
  karpenter.sh/do-not-disrupt: "true"
