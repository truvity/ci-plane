# Preset: the PREVIEW tier -- the pull-request CI plane. Opt in by
# listing it before your own values (Argo CD: `helm.valueFiles:
# [presets/preview.yaml]`; Helm: `-f presets/preview.yaml -f mine.yaml`).
# A values file you pass later wins key by key, so every number below is
# a default for this tier, never a lock.
#
# Shape: the chart's three warm-ish profiles (preview-large/medium/small,
# from values.yaml) with a wide per-set fairness limit, scheduled on an
# AWS/Karpenter pool named `ci` whose nodes carry the matching `ci`
# taint. A different pool name is an override of nodeSelector and
# tolerations, both of which REPLACE (a map or list has no merge).
# Estate facts -- the organization, the registry, the runner
# ServiceAccount, the nix builders -- are never in a preset.
maxRunners: 16
nodeSelector:
  karpenter.sh/nodepool: ci
tolerations:
  - key: arch
    operator: Exists
  - key: ci
    value: "true"
    effect: NoSchedule
listenerTolerations:
  - key: arch
    operator: Exists
podAnnotations:
  karpenter.sh/do-not-disrupt: "true"
