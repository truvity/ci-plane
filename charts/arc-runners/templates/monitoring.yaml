{{- /*
Scrapes for the runner fleet's metrics (`monitoring.enabled`, off by
default). See values.yaml for what each monitor reads and why the listener
one selects across namespaces.
*/ -}}
{{- $m := .Values.monitoring }}
{{- if $m.enabled }}
{{- if and $m.watchdog.enabled .Values.runner.watchdog.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: runner-watchdog
  labels:
    app.kubernetes.io/name: runner-watchdog
    app.kubernetes.io/part-of: arc-runners
    {{- with $m.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      actions-ephemeral-runner: "True"
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  podTargetLabels:
    - actions.github.com/scale-set-name
  podMetricsEndpoints:
    - port: watchdog
      path: /metrics
      {{- with $m.interval }}
      interval: {{ . }}
      {{- end }}
{{- end }}
{{- if $m.listener.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: scale-set-listeners
  labels:
    app.kubernetes.io/name: scale-set-listeners
    app.kubernetes.io/part-of: arc-runners
    {{- with $m.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: runner-scale-set-listener
      actions.github.com/scale-set-namespace: {{ .Release.Namespace }}
  namespaceSelector:
    matchNames:
      - {{ required "controllerServiceAccount.namespace is required: the listeners run in the controller's namespace" .Values.controllerServiceAccount.namespace }}
  podTargetLabels:
    - actions.github.com/scale-set-name
  podMetricsEndpoints:
    - port: metrics
      path: {{ $m.listener.path }}
      {{- with $m.interval }}
      interval: {{ . }}
      {{- end }}
{{- end }}
{{- end }}
