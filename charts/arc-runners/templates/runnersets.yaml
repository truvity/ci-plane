{{- if not .Values.githubConfigUrl }}{{ fail "githubConfigUrl is required" }}{{ end }}
{{- if .Values.nixBuilders.enabled }}
{{- if not .Values.runnerServiceAccountName }}{{ fail "runnerServiceAccountName is required when nixBuilders is enabled" }}{{ end }}
{{- if not .Values.nixBuilders.builders }}{{ fail "nixBuilders.builders is required when nixBuilders is enabled" }}{{ end }}
{{- /* knownHosts.pinned (default false since v5.0.0): known_hosts is
     certAuthorities alone -- the Secret is neither required nor
     mounted -- so an empty certAuthorities list would trust nothing and
     break every build, and that combination is refused. true is the
     explicit static-key path: the Secret-pinned host key is required. */}}
{{- if .Values.nixBuilders.knownHosts.pinned }}
{{- if not .Values.nixBuilders.knownHosts.existingSecret }}{{ fail "nixBuilders.knownHosts.existingSecret is required when nixBuilders.knownHosts.pinned is true" }}{{ end }}
{{- if not .Values.nixBuilders.knownHosts.key }}{{ fail "nixBuilders.knownHosts.key is required when nixBuilders.knownHosts.pinned is true" }}{{ end }}
{{- if not .Values.nixBuilders.knownHosts.revision }}{{ fail "nixBuilders.knownHosts.revision is required when nixBuilders.knownHosts.pinned is true" }}{{ end }}
{{- else if not .Values.nixBuilders.knownHosts.certAuthorities }}{{ fail "nixBuilders.knownHosts.certAuthorities is empty and knownHosts.pinned is false (the v5 default): this would trust nothing and break every build. Set one @cert-authority entry for the workers' host CA (ci-builders' nixWorkers.hostCertificate), or pin static host keys with knownHosts.pinned: true" }}{{ end }}
{{- if not (include "arc-runners.nixBuilderUser" .) }}{{ fail "nixBuilders.login.user is required when nixBuilders is enabled" }}{{ end }}
{{- if not .Values.nixBuilders.login.principal }}{{ fail "nixBuilders.login.principal is required when nixBuilders is enabled" }}{{ end }}
{{- if not (has .Values.nixBuilders.login.protocol (list "ssh" "ssh-ng")) }}{{ fail (printf "nixBuilders.login.protocol %q must be \"ssh\" or \"ssh-ng\"" .Values.nixBuilders.login.protocol) }}{{ end }}
{{- if not .Values.nixBuilders.openbao.address }}{{ fail "nixBuilders.openbao.address is required when nixBuilders is enabled" }}{{ end }}
{{- if not .Values.nixBuilders.openbao.namespace }}{{ fail "nixBuilders.openbao.namespace is required when nixBuilders is enabled" }}{{ end }}
{{- if not .Values.nixBuilders.openbao.caBundle }}{{ fail "nixBuilders.openbao.caBundle is required when nixBuilders is enabled" }}{{ end }}
{{- if not .Values.nixBuilders.openbao.sshCAPublicKeys }}{{ fail "nixBuilders.openbao.sshCAPublicKeys is required when nixBuilders is enabled" }}{{ end }}
{{- range $key := .Values.nixBuilders.openbao.sshCAPublicKeys }}{{ if not ($key | trim) }}{{ fail "nixBuilders.openbao.sshCAPublicKeys may not contain an empty key" }}{{ end }}{{ end }}
{{- if not .Values.nixBuilders.openbao.authMount }}{{ fail "nixBuilders.openbao.authMount is required when nixBuilders is enabled: the OpenBao JWT/Kubernetes auth mount the runners log in on (one per environment, e.g. jwt-<environment>); there is no default because a wrong mount fails every login silently into local builds" }}{{ end }}
{{- if not .Values.nixBuilders.openbao.authRole }}{{ fail "nixBuilders.openbao.authRole is required when nixBuilders is enabled" }}{{ end }}
{{- if not .Values.nixBuilders.openbao.sshMount }}{{ fail "nixBuilders.openbao.sshMount is required when nixBuilders is enabled" }}{{ end }}
{{- if not .Values.nixBuilders.openbao.sshRole }}{{ fail "nixBuilders.openbao.sshRole is required when nixBuilders is enabled" }}{{ end }}
{{- if not .Values.nixBuilders.openbao.audience }}{{ fail "nixBuilders.openbao.audience is required when nixBuilders is enabled" }}{{ end }}
{{- /* The certificate TTL is checked here AND in the setup binary: the
     signing role caps certificates at one hour, and asking for more must
     be a render error, not a silently truncated certificate. */}}
{{- $certTTL := toString .Values.nixBuilders.openbao.certificateTTL }}
{{- if not (regexMatch "^[0-9]+[smh]$" $certTTL) }}{{ fail (printf "nixBuilders.openbao.certificateTTL %q must be a whole number of s, m or h (e.g. 1h)" $certTTL) }}{{ end }}
{{- $certSeconds := mul (int (regexFind "^[0-9]+" $certTTL)) (get (dict "s" 1 "m" 60 "h" 3600) (regexFind "[smh]$" $certTTL)) }}
{{- if or (lt (int $certSeconds) 300) (gt (int $certSeconds) 3600) }}{{ fail (printf "nixBuilders.openbao.certificateTTL %q must be between 5m and 1h: the signing role caps certificates at one hour" $certTTL) }}{{ end }}
{{- $tokenTTL := int .Values.nixBuilders.openbao.tokenExpirationSeconds }}
{{- if or (lt $tokenTTL 600) (gt $tokenTTL 3600) }}{{ fail "nixBuilders.openbao.tokenExpirationSeconds must be between 600 and 3600" }}{{ end }}
{{- range $i, $builder := .Values.nixBuilders.builders }}
{{- if not $builder.host }}{{ fail (printf "nixBuilders.builders[%d].host is required" $i) }}{{ end }}
{{- if not $builder.system }}{{ fail (printf "nixBuilders.builders[%d].system is required" $i) }}{{ end }}
{{- if le (int $builder.maxJobs) 0 }}{{ fail (printf "nixBuilders.builders[%d].maxJobs must be positive" $i) }}{{ end }}
{{- if le (int $builder.speedFactor) 0 }}{{ fail (printf "nixBuilders.builders[%d].speedFactor must be positive" $i) }}{{ end }}
{{- end }}
{{- end }}
{{- /*
awsConfig and projectedServiceAccountTokens are release-wide only (no
per-scale-set override, unlike extraEnv/extraEnvFrom above) — one
runner-shaped credential path, not one per scale set. Checked here
because the schema cannot express either: a cross-key constraint
(awsConfig vs. a NAMED extraEnv entry) and a cross-item one (no two
projected tokens sharing a mount path).
*/}}
{{- if .Values.awsConfig.enabled }}
{{- if not .Values.awsConfig.profile }}{{ fail "awsConfig.profile is required when awsConfig.enabled" }}{{ end }}
{{- if not .Values.awsConfig.credentialProcess }}{{ fail "awsConfig.credentialProcess is required when awsConfig.enabled" }}{{ end }}
{{- range $e := .Values.extraEnv }}
{{- if eq $e.name "AWS_ACCESS_KEY_ID" }}{{ fail "awsConfig.enabled with an extraEnv entry named AWS_ACCESS_KEY_ID: the AWS SDK's own credential chain checks environment variables BEFORE a config file's credential_process, so this static key would silently keep winning over the broker-minted one -- drop it (and its extraEnvFrom Secret, if that is where it comes from) before enabling awsConfig; the two are alternatives for the same job-scoped credential, never both at once" }}{{ end }}
{{- end }}
{{- end }}
{{- if .Values.projectedServiceAccountTokens }}
{{- $seenPaths := dict }}
{{- range $i, $t := .Values.projectedServiceAccountTokens }}
{{- if hasKey $seenPaths $t.path }}{{ fail (printf "projectedServiceAccountTokens[%d]: path %q is already used by another entry -- the kubelet projects every source into ONE directory, so a second entry naming the same path would silently replace the first at apply time" $i $t.path) }}{{ end }}
{{- $_ := set $seenPaths $t.path true }}
{{- end }}
{{- end }}
{{- $root := . }}
{{- range $name, $p := .Values.scaleSets }}
{{- /*
The CRs are rendered DIRECTLY rather than through the upstream
gha-runner-scale-set chart: the controller and that chart share a
version stream, and bundling the chart here would let the two drift.
The CR API (actions.github.com/v1alpha1) is the contract with the
controller; labels and the manager Role/RoleBinding mirror what the
upstream chart creates. The values-hash annotation changes whenever
this set's rendered inputs change, which is what prompts the
controller to recycle the listener — same mechanism as upstream.
*/}}
{{- /* hasKey, NOT `| default`: sprig's default treats 0 as empty, so a
     profile asking for minRunners 0 (a deliberately COLD set) silently
     rendered as the chart default 1 — the same bool-false trap that bit
     renderFleet. maxRunners keeps `default` because 0 there is
     meaningless (a set that can never run a job). */}}
{{- $min := $root.Values.minRunners }}
{{- if hasKey $p "minRunners" }}{{ $min = $p.minRunners }}{{ end }}
{{- /*
v4.1.0: per-scale-set overrides, each REPLACING the release-wide value
(not merging into it — a map or list has one obvious "unset" state,
empty, and a deep merge would leave no way to ask for that) when the
key is present on this scale set at all. hasKey again, not `default`:
an explicit `nodeSelector: {}` or `extraEnv: []` on one set must render
as "nothing", not fall back to the release-wide value because an empty
map/list looks unset to sprig's `default`. */}}
{{- $nodeSelector := $root.Values.nodeSelector }}
{{- if hasKey $p "nodeSelector" }}{{ $nodeSelector = $p.nodeSelector }}{{ end }}
{{- $tolerations := $root.Values.tolerations }}
{{- if hasKey $p "tolerations" }}{{ $tolerations = $p.tolerations }}{{ end }}
{{- $podAnnotations := $root.Values.podAnnotations }}
{{- if hasKey $p "podAnnotations" }}{{ $podAnnotations = $p.podAnnotations }}{{ end }}
{{- $extraEnv := $root.Values.extraEnv }}
{{- if hasKey $p "extraEnv" }}{{ $extraEnv = $p.extraEnv }}{{ end }}
{{- $extraEnvFrom := $root.Values.extraEnvFrom }}
{{- if hasKey $p "extraEnvFrom" }}{{ $extraEnvFrom = $p.extraEnvFrom }}{{ end }}
{{- /*
nixSandbox is per-set only — there is no release-wide default to fall
back to, since sandboxing one set says nothing about the others. A
seccompProfile is required the moment enabled is true: an admission
policy or a node can only ever protect a NAMED profile, so an empty
name here would either fail closed everywhere (nothing to fence) or,
worse, render a pod that asks the kubelet for a Localhost profile with
no path — a refusal at the kubelet, far from this chart's own error.
See docs/nix-sandbox.md for what the profile has to contain and how to
generate it (hack/gen-nix-sandbox-seccomp.sh). */}}
{{- $nixSandbox := $p.nixSandbox | default (dict) }}
{{- if $nixSandbox.enabled }}
{{- if not $nixSandbox.seccompProfile }}{{ fail (printf "scaleSets.%s.nixSandbox.seccompProfile is required when nixSandbox.enabled" $name) }}{{ end }}
{{- end }}
{{- /*
restricted (v5.1.0) is per-set only, like nixSandbox: it moves ONE scale
set's runner pods, their init container and their listener onto the
Pod Security `restricted` profile (non-root with an explicit numeric
uid, seccomp RuntimeDefault, no privilege escalation, every capability
dropped). Off by default, and a set that leaves it off renders exactly
as it did before the key existed. See docs/restricted-runners.md for
what a job loses.
*/}}
{{- $restricted := false }}
{{- if hasKey $p "restricted" }}
{{- if not (kindIs "bool" $p.restricted) }}{{ fail (printf "scaleSets.%s.restricted must be true or false, not %q" $name (toString $p.restricted)) }}{{ end }}
{{- $restricted = $p.restricted }}
{{- end }}
{{- $nixConfig := include "arc-runners.nixConfigFor" (dict "root" $root "p" $p) }}
{{- $nixConfigName := include "arc-runners.nixConfigNameFor" (dict "root" $root "p" $p) }}
{{- /* Disabled, the hash input is exactly the pre-nixBuilders one, so a
     release that only carries the (off) feature recycles no listener.
     The new v4.1.0 keys enter the hash ONLY when this set actually sets
     them (hasKey / non-empty checks below) — never unconditionally — so
     a release that uses none of them hashes byte-identically to before
     this feature existed; that identity is the golden proof for the
     default case. */}}
{{- $spec := dict "p" $p "img" (include "arc-runners.runnerImage" $root) "min" $min "max" ($p.maxRunners | default $root.Values.maxRunners) "url" $root.Values.githubConfigUrl "nixConfig" $root.Values.nixConfig }}
{{- if $root.Values.nixBuilders.enabled }}
{{- $_ := set $spec "nixBuilders" $root.Values.nixBuilders }}
{{- $_ := set $spec "nixConfigName" $nixConfigName }}
{{- end }}
{{- if hasKey $p "nodeSelector" }}{{ $_ := set $spec "nodeSelector" $nodeSelector }}{{ end }}
{{- if hasKey $p "tolerations" }}{{ $_ := set $spec "tolerations" $tolerations }}{{ end }}
{{- if hasKey $p "affinity" }}{{ $_ := set $spec "affinity" $p.affinity }}{{ end }}
{{- if hasKey $p "podAnnotations" }}{{ $_ := set $spec "podAnnotations" $podAnnotations }}{{ end }}
{{- if hasKey $p "extraEnv" }}{{ $_ := set $spec "extraEnv" $extraEnv }}{{ end }}
{{- if hasKey $p "extraEnvFrom" }}{{ $_ := set $spec "extraEnvFrom" $extraEnvFrom }}{{ end }}
{{- if $p.extraNixConfig }}{{ $_ := set $spec "extraNixConfig" $p.extraNixConfig }}{{ end }}
{{- if $nixSandbox.enabled }}{{ $_ := set $spec "nixSandbox" $nixSandbox }}{{ end }}
{{- if $restricted }}{{ $_ := set $spec "restricted" $root.Values.runnerUser }}{{ end }}
{{- if $root.Values.awsConfig.enabled }}{{ $_ := set $spec "awsConfig" $root.Values.awsConfig }}{{ end }}
{{- if $root.Values.projectedServiceAccountTokens }}{{ $_ := set $spec "projectedServiceAccountTokens" $root.Values.projectedServiceAccountTokens }}{{ end }}
{{- if $root.Values.extraVolumes }}{{ $_ := set $spec "extraVolumes" $root.Values.extraVolumes }}{{ end }}
{{- if $root.Values.extraVolumeMounts }}{{ $_ := set $spec "extraVolumeMounts" $root.Values.extraVolumeMounts }}{{ end }}
{{- if $root.Values.extraInitContainers }}{{ $_ := set $spec "extraInitContainers" $root.Values.extraInitContainers }}{{ end }}
{{- /*
Whether the pod spec carries an initContainers/volumeMounts/volumes key
at all — each stays OMITTED, not rendered empty, when none of its
sources are in play, which is what keeps a release using none of these
v4.2.0 hooks byte-identical to one built without them (the golden proof
for the default case, same rule the keys above already follow for the
values-hash).
*/}}
{{- $hasInitContainers := or $root.Values.nixBuilders.enabled (gt (len $root.Values.extraInitContainers) 0) }}
{{- $hasVolumeMounts := or $root.Values.nixBuilders.enabled $root.Values.awsConfig.enabled (gt (len $root.Values.extraVolumeMounts) 0) (gt (len $root.Values.projectedServiceAccountTokens) 0) }}
{{- $hasVolumes := or $root.Values.nixBuilders.enabled $root.Values.awsConfig.enabled (gt (len $root.Values.extraVolumes) 0) (gt (len $root.Values.projectedServiceAccountTokens) 0) }}
---
apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $name }}
    app.kubernetes.io/component: autoscaling-runner-set
    app.kubernetes.io/part-of: gha-rs
    # The controller's compatibility gate — see values.arcVersion.
    app.kubernetes.io/version: {{ $root.Values.arcVersion | quote }}
    actions.github.com/organization: {{ include "arc-runners.org" $root }}
    actions.github.com/scale-set-name: {{ $name }}
    actions.github.com/scale-set-namespace: {{ $root.Release.Namespace }}
  annotations:
    actions.github.com/runner-group-name: {{ $root.Values.runnerGroup }}
    actions.github.com/runner-scale-set-name: {{ $name }}
    actions.github.com/cleanup-manager-role-name: {{ $name }}-gha-rs-manager
    actions.github.com/cleanup-manager-role-binding: {{ $name }}-gha-rs-manager
    actions.github.com/values-hash: {{ $spec | toJson | sha256sum | trunc 63 }}
spec:
  githubConfigUrl: {{ $root.Values.githubConfigUrl }}
  githubConfigSecret: {{ $root.Values.githubConfigSecret }}
  runnerGroup: {{ $root.Values.runnerGroup }}
  minRunners: {{ $min }}
  maxRunners: {{ $p.maxRunners | default $root.Values.maxRunners }}
  listenerTemplate:
    spec:
      {{- with $root.Values.listenerTolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $restricted }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      containers:
        - name: listener
          {{- if $restricted }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- end }}
  template:
    metadata:
      {{- if $root.Values.packing.enabled }}
      # Pod-template labels reach the runner pod verbatim; this one is
      # what every runner's packing affinity looks for (values.packing).
      labels:
        {{- include "arc-runners.packingLabels" $root | nindent 8 }}
      {{- end }}
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with $root.Values.runnerServiceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- if $root.Values.nixBuilders.enabled }}
      automountServiceAccountToken: false
      {{- end }}
      {{- /*
      hostUsers: false is the pod-level half of nixSandbox (the other
      half is the runner container's procMount/seccompProfile below).
      Only rendered when THIS set asks for it — an unsandboxed set's pod
      spec carries no hostUsers key at all, exactly as before v4.1.0.
      Nix's own build sandbox creates a NESTED user namespace per
      derivation; the pod needs its own first, or the nested one has
      nowhere to live. See docs/nix-sandbox.md.
      */}}
      {{- if $nixSandbox.enabled }}
      hostUsers: false
      {{- end }}
      {{- if $restricted }}
      # Pod Security `restricted`. The uid is numeric on purpose: the
      # image's USER is the NAME `runner`, which the kubelet cannot check
      # against runAsNonRoot. fsGroup is what lets the non-root init
      # container write the two emptyDirs (they mount root-owned).
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $root.Values.runnerUser.uid }}
        runAsGroup: {{ $root.Values.runnerUser.gid }}
        fsGroup: {{ $root.Values.runnerUser.gid }}
        seccompProfile:
          type: RuntimeDefault
      {{- end }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "arc-runners.affinity" (dict "root" $root "p" $p) }}
      affinity:
        {{- . | nindent 8 }}
      {{- end }}
      {{- if $hasInitContainers }}
      initContainers:
        {{- if $root.Values.nixBuilders.enabled }}
        - name: prepare-nix-builder-ssh
          image: {{ include "arc-runners.runnerImage" $root }}
          command: ["/usr/local/bin/nix-worker-client-setup"]
          env:
            {{- include "arc-runners.nixBuilderEnv" $root | nindent 12 }}
          securityContext:
            {{- if $restricted }}
            # Restricted: the same uid as the runner, no capabilities. The
            # emptyDirs are group-writable through the pod's fsGroup, so
            # nothing needs handing over; the setup binary skips the
            # chmod/chown it may not do on a directory it does not own.
            runAsNonRoot: true
            runAsUser: {{ $root.Values.runnerUser.uid }}
            runAsGroup: {{ $root.Values.runnerUser.gid }}
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            {{- else }}
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # Root hands both emptyDirs (and every file it writes into
            # them) to `runner`, which the job-started hook runs as: CHOWN
            # for the handover, DAC_OVERRIDE to keep writing into the
            # now runner-owned 0700 directory. Without either, init fails
            # with EPERM/EACCES and the pod never starts.
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE"]
            {{- end }}
          volumeMounts:
            {{- if $root.Values.nixBuilders.knownHosts.pinned }}
            - name: nix-builder-known-hosts
              mountPath: /var/run/nix-builder-known-hosts
              readOnly: true
            {{- end }}
            - name: nix-builder-config
              mountPath: /var/run/nix-builder-config
              readOnly: true
            - name: nix-builder-openbao-token
              mountPath: /var/run/secrets/openbao
              readOnly: true
            - name: nix-builder-ssh
              mountPath: /var/run/nix-builder-ssh
            - name: nix-builders
              mountPath: /var/run/nix-builders
        {{- end }}
        {{- with $root.Values.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: runner
          image: {{ include "arc-runners.runnerImage" $root }}
          command: ["/home/runner/run.sh"]
          {{- with $extraEnvFrom }}
          # Credentials the runner needs that this chart must not know: an
          # object store with no pod identity wants an access key, and the
          # right place for it is a Secret in the cluster -- delivered by
          # whatever the estate uses -- rather than a repository secret in
          # GitHub. envFrom rather than named entries, so a provider that
          # reads three variables needs no chart change to read a fourth.
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $nixSandbox.enabled }}
          # procMount/seccomp are the container-level half of nixSandbox;
          # hostUsers above is the pod-level half. Baseline pod security
          # allows procMount: Unmasked only because hostUsers is false
          # (Kubernetes >=1.35's check_procMount_baseline.go) -- the two
          # always render together, never one without the other. The
          # profile itself must already exist on every node this set can
          # land on (docs/nix-sandbox.md, hack/gen-nix-sandbox-seccomp.sh)
          # and, ideally, be fenced so only this set's pods can name it
          # (values.nixSandbox.fence.enabled) -- baseline PSA allows ANY
          # Localhost profile to ANY pod on the node that has the file.
          {{- end }}
          {{- if or $nixSandbox.enabled $restricted }}
          securityContext:
            {{- if $restricted }}
            runAsNonRoot: true
            runAsUser: {{ $root.Values.runnerUser.uid }}
            runAsGroup: {{ $root.Values.runnerUser.gid }}
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            {{- end }}
            {{- if $nixSandbox.enabled }}
            procMount: Unmasked
            seccompProfile:
              type: Localhost
              localhostProfile: {{ $nixSandbox.seccompProfile | quote }}
            {{- end }}
          {{- end }}
          env:
            - name: GOMAXPROCS
              value: {{ $p.gomaxprocs | quote }}
            {{- with $extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if $nixConfig }}
            - name: NIX_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: {{ $nixConfigName }}
                  key: nix.conf
            {{- end }}
            {{- if $root.Values.nixBuilders.enabled }}
            # Per-job signing: the runner runs this hook as `runner` before
            # the job's first step (see arc-runners.nixJobStartedHook). The
            # init container's certificate covers only a job that starts
            # within the hour; a warm pod outlives it.
            - name: ACTIONS_RUNNER_HOOK_JOB_STARTED
              value: /var/run/nix-builder-config/job-started.sh
            - name: NIX_BUILDER_SSH_DIR
              value: /home/runner/.ssh
            - name: NIX_BUILDER_MACHINES_DIR
              value: /etc/nix-builders
            {{- include "arc-runners.nixBuilderEnv" $root | nindent 12 }}
            {{- end }}
            {{- if $root.Values.awsConfig.enabled }}
            # JOB-scoped, not CLIENT-scoped: an ephemeral runner's `runner`
            # container is the one place every step of ONE job runs, so
            # AWS_PROFILE here is the default for any `aws`/SDK call that
            # job makes, not only the Go cache client this exists for. A
            # step that needs a DIFFERENT AWS identity in the same job sets
            # its own AWS_PROFILE (or --profile) to override this default,
            # exactly as it would override any other environment default.
            # See values.yaml's awsConfig comment for the render-time
            # refusal that catches the opposite direction: a static
            # AWS_ACCESS_KEY_ID left in extraEnv, which would silently
            # outrank this profile rather than the other way around.
            - name: AWS_CONFIG_FILE
              value: /var/run/aws-config/config
            - name: AWS_PROFILE
              value: {{ $root.Values.awsConfig.profile | quote }}
            {{- end }}
          resources:
            {{- toYaml $p.resources | nindent 12 }}
          {{- if $hasVolumeMounts }}
          {{- if $root.Values.nixBuilders.enabled }}
          # Writable by `runner` (the init container chowns both emptyDirs to
          # it): the job-started hook replaces the key, certificate and
          # machines file. The projected token is here for the same hook, so
          # workflow code can read it too — see docs/architecture.md.
          {{- end }}
          volumeMounts:
            {{- if $root.Values.nixBuilders.enabled }}
            {{- if $root.Values.nixBuilders.knownHosts.pinned }}
            - name: nix-builder-known-hosts
              mountPath: /var/run/nix-builder-known-hosts
              readOnly: true
            {{- end }}
            - name: nix-builder-config
              mountPath: /var/run/nix-builder-config
              readOnly: true
            - name: nix-builder-openbao-token
              mountPath: /var/run/secrets/openbao
              readOnly: true
            - name: nix-builder-ssh
              mountPath: /home/runner/.ssh
            - name: nix-builders
              mountPath: /etc/nix-builders
            {{- end }}
            {{- if $root.Values.awsConfig.enabled }}
            - name: aws-config
              mountPath: /var/run/aws-config
              readOnly: true
            {{- end }}
            {{- if $root.Values.projectedServiceAccountTokens }}
            - name: extra-tokens
              mountPath: /var/run/secrets/tokens
              readOnly: true
            {{- end }}
            {{- with $root.Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if $hasVolumes }}
      volumes:
        {{- if $root.Values.nixBuilders.enabled }}
        {{- if $root.Values.nixBuilders.knownHosts.pinned }}
        - name: nix-builder-known-hosts
          secret:
            secretName: {{ $root.Values.nixBuilders.knownHosts.existingSecret }}
            defaultMode: 0444
            items:
              - key: {{ $root.Values.nixBuilders.knownHosts.key }}
                path: known_hosts
        {{- end }}
        - name: nix-builder-config
          configMap:
            name: {{ $nixConfigName }}
            items:
              - key: machines.template
                path: machines.template
              - key: ssh_config
                path: ssh_config
              - key: openbao-ca.crt
                path: openbao-ca.crt
              - key: ssh-user-ca.pub
                path: ssh-user-ca.pub
              - key: job-started.sh
                path: job-started.sh
                mode: 0555
              - key: known-hosts-cert-authorities
                path: known-hosts-cert-authorities
        # 0444: the runner container runs as `runner`, not root, and its
        # job-started hook must read the token. The boundary is which
        # containers mount it, not the mode: every process in the runner
        # container is the job's own user.
        - name: nix-builder-openbao-token
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  audience: {{ $root.Values.nixBuilders.openbao.audience | quote }}
                  expirationSeconds: {{ $root.Values.nixBuilders.openbao.tokenExpirationSeconds }}
                  path: token
        - name: nix-builder-ssh
          emptyDir: {}
        - name: nix-builders
          emptyDir: {}
        {{- end }}
        {{- if $root.Values.awsConfig.enabled }}
        - name: aws-config
          configMap:
            name: runner-aws-config
        {{- end }}
        {{- if $root.Values.projectedServiceAccountTokens }}
        # 0444: read by whatever job-side code the estate points at this
        # path, not only root — same reasoning as nix-builder-openbao-token
        # above. ONE volume, several sources: the kubelet projects every
        # source of one projected volume into the same directory, which is
        # exactly why two entries may not share a `path` (refused above).
        - name: extra-tokens
          projected:
            defaultMode: 0444
            sources:
              {{- range $t := $root.Values.projectedServiceAccountTokens }}
              - serviceAccountToken:
                  audience: {{ $t.audience | quote }}
                  path: {{ $t.path | quote }}
                  {{- if $t.expirationSeconds }}
                  expirationSeconds: {{ $t.expirationSeconds }}
                  {{- end }}
              {{- end }}
        {{- end }}
        {{- with $root.Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
---
# The controller's per-scale-set manager Role — mirrors the upstream
# chart: the controller SA needs these in the runner namespace to run
# ephemeral runners here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-gha-rs-manager
  labels:
    app.kubernetes.io/part-of: gha-rs
    app.kubernetes.io/instance: {{ $name }}
    app.kubernetes.io/component: manager-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create", "delete", "get", "patch", "update"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles"]
    verbs: ["create", "delete", "get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-gha-rs-manager
  labels:
    app.kubernetes.io/part-of: gha-rs
    app.kubernetes.io/instance: {{ $name }}
    app.kubernetes.io/component: manager-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-gha-rs-manager
subjects:
  - kind: ServiceAccount
    name: {{ $root.Values.controllerServiceAccount.name }}
    namespace: {{ $root.Values.controllerServiceAccount.namespace }}
{{- end }}
