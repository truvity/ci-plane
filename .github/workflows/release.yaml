# Release: a v* tag publishes the whole plane at ONE version — both
# images and both charts. Consumers pin one chart version and are
# transitively digest-pinned.
#
# Tag creation is restricted by ruleset (role-runner-release): who can
# tag is who can publish. Nothing rebuilds on a schedule and nothing
# publishes from a PR or a master merge.
#
# THE SHAPE, and why it is three stages rather than one:
#
#   base-<arch>   the heavy Dockerfiles (apt, nix, devbox, the docker
#                 toolchain), built ONCE PER ARCHITECTURE on a NATIVE
#                 runner. arm64 runs on ubuntu-24.04-arm, so nothing is
#                 emulated: this is where all the build time is.
#   merge         one manifest list per image, from the two native halves.
#   release       the shared public release: goreleaser builds the
#                 RUN-LESS Dockerfiles under image/release/ -- `FROM` the
#                 manifest list plus labels, which buildx assembles per
#                 platform without executing anything -- and helmctl
#                 packages both charts from dist/artifacts.json.
#
# The old shape built both architectures in one job under QEMU and
# carried a skip-rebuild gate, because an emulated arm64 build was
# expensive enough that rebuilding for a chart-only change rolled the
# fleet for nothing. Native builds plus a registry layer cache replace
# that gate: an unchanged base is cheap to rebuild, so there is no
# "did image/ change since the last tag?" question to get wrong, and no
# possibility of a chart published against a digest from another tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/truvity/ci-plane

jobs:
  base:
    name: base-${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # NATIVE, both of them. The arm64 half used to run under QEMU
          # user emulation, which is also why the runner image carries
          # `filter-syscalls = false`: nix's seccomp load fails there.
          # That workaround can be revisited now, on evidence.
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # No QEMU anywhere in this workflow: this job is native, and the
      # release job's Dockerfiles execute nothing.
      - name: Build the per-arch bases
        run: |
          set -euo pipefail
          for img in runner nix-worker; do
            docker buildx build \
              --platform "linux/${{ matrix.arch }}" \
              --file "image/${img}/Dockerfile" \
              --tag "${IMAGE_REPO}/${img}-base:${GITHUB_REF_NAME}-${{ matrix.arch }}" \
              --cache-from "type=registry,ref=${IMAGE_REPO}/${img}-base:cache-${{ matrix.arch }}" \
              --cache-to   "type=registry,ref=${IMAGE_REPO}/${img}-base:cache-${{ matrix.arch }},mode=max" \
              --push \
              image/
          done

  merge:
    needs: base
    runs-on: ubuntu-latest
    steps:
      - name: Login to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # One manifest list per image, so the release Dockerfile's plain
      # `FROM <base>:<version>` resolves per platform. Without this the
      # release job would have nothing multi-arch to assemble from.
      - name: Merge the native halves
        run: |
          set -euo pipefail
          for img in runner nix-worker; do
            docker buildx imagetools create \
              --tag "${IMAGE_REPO}/${img}-base:${GITHUB_REF_NAME}" \
              "${IMAGE_REPO}/${img}-base:${GITHUB_REF_NAME}-amd64" \
              "${IMAGE_REPO}/${img}-base:${GITHUB_REF_NAME}-arm64"
            docker buildx imagetools inspect "${IMAGE_REPO}/${img}-base:${GITHUB_REF_NAME}" \
              --format '{{json .Manifest.Digest}}'
          done

  release:
    needs: merge
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@900eedd3c32305efa543ced069f190de80f12143 # v3.10.0
    with:
      charts: '["arc-runners","ci-builders"]'
      chart-root: charts
      # The charts' image values come from dist/artifacts.json -- the
      # digests goreleaser actually pushed, in this same job. Nothing
      # stamps a digest by hand, so a chart cannot be published against
      # an image from another release.
      chart-images: goreleaser
