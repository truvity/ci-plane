# Release: a v* tag publishes the whole plane at ONE version — both
# images and both charts, with each image's digest stamped into the
# chart defaults. Consumers pin one chart version and are transitively
# digest-pinned.
#
# Tag creation is restricted by ruleset (role-runner-release): who can
# tag is who can publish. Nothing rebuilds on a schedule and nothing
# publishes from a PR or a master merge.
#
# THE SHAPE, and why it is three stages:
#
#   base-<arch>  the heavy Dockerfiles (apt, nix, devbox, the docker
#                toolchain), built ONCE PER ARCHITECTURE on a NATIVE
#                runner. arm64 runs on ubuntu-24.04-arm, so nothing is
#                emulated: this is where all the build time used to go.
#   release      merges each pair into a manifest list, then builds the
#                RUN-LESS Dockerfiles under image/release/ -- `FROM` that
#                list plus labels, which buildx assembles per platform
#                without executing anything -- and publishes the charts.
#
# The old shape built both architectures in one job under QEMU and
# carried a skip-rebuild gate, because an emulated arm64 build was
# expensive enough that rebuilding for a chart-only change rolled the
# fleet for nothing. Native builds plus a registry layer cache replace
# that gate: an unchanged base is cheap to rebuild, so there is no "did
# image/ change since the last tag?" to get wrong, and no way to publish
# a chart against a digest from another tag.
#
# NOT YET THE SHARED release-public.yaml, and the reason is specific:
# helmctl fills a chart's image values from goreleaser's
# dist/artifacts.json, reading and validating a single `images:` map.
# These charts carry top-level `runnerImage:` / `nixWorkerImage:`, so the
# manifest would merge an `images:` key no template reads and the charts
# would ship unstamped -- green, and uninstallable. Adopting that
# convention is a breaking values change with consumers to move, so it is
# its own piece of work; hack/stamp-digests.sh holds the line until then.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/truvity/ci-plane
  CHARTS: ghcr.io/truvity/charts

jobs:
  base:
    name: base-${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # NATIVE, both. The arm64 half used to run under QEMU user
          # emulation -- which is also why the runner image carries
          # `filter-syscalls = false`: nix's seccomp load fails there.
          # That workaround can be revisited now, on evidence.
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Resolve version from the release tag
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::releases build only from v* tags (got $GITHUB_REF)"; exit 1 ;;
          esac
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_ACTOR: ${{ github.actor }}

      # No QEMU anywhere in this workflow: this job is native, and the
      # release job's Dockerfiles execute nothing.
      - name: Build the per-arch bases
        run: |
          set -euo pipefail
          for img in runner nix-worker; do
            docker buildx build \
              --platform "linux/${{ matrix.arch }}" \
              --file "image/${img}/Dockerfile" \
              --tag "${IMAGE_REPO}/${img}-base:${GITHUB_REF_NAME}-${{ matrix.arch }}" \
              --cache-from "type=registry,ref=${IMAGE_REPO}/${img}-base:cache-${{ matrix.arch }}" \
              --cache-to   "type=registry,ref=${IMAGE_REPO}/${img}-base:cache-${{ matrix.arch }},mode=max" \
              --push \
              image/
          done

  release:
    needs: base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_ACTOR: ${{ github.actor }}

      # One manifest list per image, so the release Dockerfile's plain
      # `FROM <base>:<version>` resolves per platform. Without this there
      # would be nothing multi-arch to assemble from.
      - name: Merge the native halves
        run: |
          set -euo pipefail
          for img in runner nix-worker; do
            docker buildx imagetools create \
              --tag "${IMAGE_REPO}/${img}-base:${GITHUB_REF_NAME}" \
              "${IMAGE_REPO}/${img}-base:${GITHUB_REF_NAME}-amd64" \
              "${IMAGE_REPO}/${img}-base:${GITHUB_REF_NAME}-arm64"
          done

      - name: Build and push the release images
        id: images
        run: |
          set -euo pipefail
          for img in runner nix-worker; do
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --file "image/release/${img}.Dockerfile" \
              --build-arg "BASE_IMAGE=${IMAGE_REPO}/${img}-base" \
              --build-arg "BASE_TAG=${GITHUB_REF_NAME}" \
              --build-arg "VERSION=${GITHUB_REF_NAME}" \
              --build-arg "REVISION=${GITHUB_SHA}" \
              --tag "${IMAGE_REPO}/${img}:${GITHUB_REF_NAME}" \
              --push \
              image/
            digest=$(docker buildx imagetools inspect "${IMAGE_REPO}/${img}:${GITHUB_REF_NAME}" \
                       --format '{{json .Manifest.Digest}}' | tr -d '"')
            # Underscored: a hyphen in `steps.x.outputs.nix-worker`
            # parses as SUBTRACTION in a GitHub expression and resolves
            # to empty, which actionlint does not catch and which would
            # have stamped an empty digest.
            echo "${img//-/_}=${digest}" >> "$GITHUB_OUTPUT"
            echo "${img} image digest: \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"
          done

      # BY KEY, never by a blind sed over every `digest:` line: with two
      # images that would write the runner's digest into nixWorkerImage,
      # and the worker would run the runner image again -- silently,
      # because the value is a valid digest and the pods start.
      - name: Stamp the digests into chart defaults
        run: |
          set -euo pipefail
          ./hack/stamp-digests.sh \
            "runnerImage=${{ steps.images.outputs.runner }}" \
            "nixWorkerImage=${{ steps.images.outputs.nix_worker }}"
          VERSION="${GITHUB_REF_NAME#v}"
          for c in charts/*/Chart.yaml; do
            sed -i -E "s|^version: .*$|version: ${VERSION}|; s|^appVersion: .*$|appVersion: ${VERSION}|" "$c"
          done

      - name: Login helm to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Package and push charts
        run: |
          set -euo pipefail
          mkdir -p dist
          for c in charts/*; do
            helm lint "$c"
            helm package "$c" -d dist
          done
          for pkg in dist/*.tgz; do
            helm push "$pkg" "oci://${CHARTS#ghcr.io/}" 2>/dev/null || helm push "$pkg" "oci://$CHARTS"
          done
          echo "charts published at ${GITHUB_REF_NAME#v}: $(ls dist)" >> "$GITHUB_STEP_SUMMARY"
          echo "gitops pin: \`ciPlane: \"${GITHUB_REF_NAME#v}\"\`" >> "$GITHUB_STEP_SUMMARY"
