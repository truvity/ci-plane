# Release: a v* tag publishes the whole plane at ONE version — the
# runner image (only if image/ changed) and both charts, with the image
# digest stamped into the chart defaults. Consumers pin one chart
# version and are transitively digest-pinned.
#
# Tag creation is restricted by ruleset (role-runner-release): who can
# tag is who can publish. Nothing rebuilds on a schedule and nothing
# publishes from a PR or a master merge.
#
# SKIP-REBUILD is load-bearing: an image rebuild always yields a new
# digest (apt-get, `latest` runner ARG), which would roll the entire
# runner fleet for a chart-only change. When image/ is unchanged since
# the previous v* tag, the previous tag's manifest is re-tagged (a
# manifest copy — the digest is preserved) instead of rebuilt.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/truvity/ci-plane/runner
  CHARTS: ghcr.io/truvity/charts

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version from the release tag
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::releases build only from v* tags (got $GITHUB_REF)"; exit 1 ;;
          esac
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the previous v* tag anchors the image-changed
          # test below.
          fetch-depth: 0

      - name: Login to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Decide whether image/ changed since the previous release
        id: gate
        run: |
          PREV=$(git tag --list 'v*' --sort=-version:refname | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
          if [ -z "$PREV" ]; then
            echo "first release — building"; echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$PREV" "$GITHUB_REF_NAME" -- image/; then
            # Reuse only if the previous tag's image actually exists.
            if docker manifest inspect "$IMAGE:$PREV" > /dev/null 2>&1; then
              echo "image/ unchanged since $PREV — reusing its digest"
              echo "build=false" >> "$GITHUB_OUTPUT"
            else
              echo "image/ unchanged but $PREV has no image — building"
              echo "build=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "image/ changed since $PREV — building"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        if: steps.gate.outputs.build == 'true'

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        if: steps.gate.outputs.build == 'true'

      - name: Build and push (multi-arch)
        if: steps.gate.outputs.build == 'true'
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE:${{ steps.version.outputs.version }}" \
            --push \
            image/

      - name: Re-tag the previous digest (manifest copy)
        if: steps.gate.outputs.build == 'false'
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:${{ steps.version.outputs.version }}" \
            "$IMAGE:${{ steps.gate.outputs.prev }}"

      - name: Resolve the release digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:${{ steps.version.outputs.version }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "### ci-plane ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "runner image digest: \`$DIGEST\` (rebuilt: ${{ steps.gate.outputs.build }})" >> "$GITHUB_STEP_SUMMARY"

  charts:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Stamp the digest into chart defaults
        run: |
          VERSION="${{ needs.image.outputs.version }}"
          DIGEST="${{ needs.image.outputs.digest }}"
          for c in charts/*/values.yaml; do
            sed -i -E "s|^(  digest: ).*# sha256:.*$|\1\"$DIGEST\"|" "$c"
            grep -q "$DIGEST" "$c" || { echo "::error::digest stamp failed in $c"; exit 1; }
          done
          for c in charts/*/Chart.yaml; do
            sed -i -E "s|^version: .*$|version: ${VERSION#v}|; s|^appVersion: .*$|appVersion: ${VERSION#v}|" "$c"
          done

      - name: Login helm to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Package and push charts
        run: |
          VERSION="${{ needs.image.outputs.version }}"
          mkdir -p dist
          for c in charts/*; do
            helm lint "$c"
            helm package "$c" -d dist
          done
          for pkg in dist/*.tgz; do
            helm push "$pkg" "oci://${CHARTS#ghcr.io/}" 2>/dev/null || helm push "$pkg" "oci://$CHARTS"
          done
          echo "charts published at ${VERSION#v}: $(ls dist)" >> "$GITHUB_STEP_SUMMARY"
          echo "gitops pin: \`ciPlane: \"${VERSION#v}\"\`" >> "$GITHUB_STEP_SUMMARY"

  # Digest/version-bump PR against truvity/gitops — opened by the CI
  # automation App so the PR's checks fire. Skips cleanly while the App
  # is not configured on this repository.
  bump-pin:
    needs: [image, charts]
    runs-on: ubuntu-latest
    if: vars.CI_AUTOMATION_APP_ID != ''
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ vars.CI_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.CI_AUTOMATION_PRIVATE_KEY }}
          owner: truvity
          repositories: gitops

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: truvity/gitops
          ref: master
          token: ${{ steps.app-token.outputs.token }}

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Install devbox
        run: curl -fsSL https://get.jetify.com/devbox | bash -s -- -f

      - name: Open the pin PR (one standing branch, force-pushed, auto-merge armed)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          set -euo pipefail
          PIN="${VERSION#v}"
          if grep -qE "^ciPlane: \"$PIN\"" cfg/versions.yaml; then
            echo "pin already current"; exit 0
          fi
          sed -i -E "s|^ciPlane: \".*\"|ciPlane: \"$PIN\"|" cfg/versions.yaml
          # The pin flows into values/versions and the golden renders;
          # a PR without them is born red on the drift post-condition.
          devbox run -- just render
          devbox run -- just golden
          git config user.name "truvity-ci-automation[bot]"
          git config user.email "truvity-ci-automation[bot]@users.noreply.github.com"
          git checkout -B ci-plane-pin
          git add cfg/versions.yaml cfggen.lock.yaml values/ internal/rendertest/testdata/
          git commit -m "chore(versions): ci-plane → ${VERSION}"
          git push -f origin ci-plane-pin
          gh pr create --repo truvity/gitops --head ci-plane-pin \
            --title "chore(versions): ci-plane → ${VERSION}" \
            --body "One united version: charts at ${PIN} with the runner image digest stamped in; renders and goldens regenerated in-branch." \
            2>/dev/null || echo "PR already open — branch force-pushed"
          gh pr merge ci-plane-pin --repo truvity/gitops --squash --auto \
            || echo "auto-merge not armed (checks/permissions) — PR awaits a human"
