name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  # govulncheck over the Go modules (image/nix-worker-client,
  # image/nix-worker-host-cert, image/runner-watchdog,
  # deploy/pulumi/runneridentity). The shared check workflow
  # takes recipes, not module paths, so the Justfile's `vuln` recipe walks
  # the modules itself.
  #
  # Deliberately NOT in ci.yaml and deliberately not a required context: a
  # standard-library advisory with no released fix would otherwise wedge
  # every pull request on a finding nobody can act on.
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@8ab8774ba50e3668dcb5a07ad40ec900866ae140 # v3.33.0
    with:
      recipes: '["vuln"]'
