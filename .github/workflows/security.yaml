name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  # govulncheck over the two Go helper modules under image/
  # (nix-worker-client, nix-worker-host-cert). The shared check workflow
  # takes recipes, not module paths, so the Justfile's `vuln` recipe walks
  # the modules itself.
  #
  # Deliberately NOT in ci.yaml and deliberately not a required context: a
  # standard-library advisory with no released fix would otherwise wedge
  # every pull request on a finding nobody can act on.
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@58d470dff71c732e208f47a80bb6c5d741e016a7 # v3.25.0
    with:
      recipes: '["vuln"]'
